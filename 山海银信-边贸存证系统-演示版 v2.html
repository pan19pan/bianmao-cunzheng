<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山海银信——AI让边境口头交易有凭可依</title>
<style id="appStyle">
/* ================= tokens ================= */
:root{
  --paper:#FAF7F0; --paper-2:#F3EEE2; --card:#FFFDF8;
  --ink:#1B2A2C; --ink-2:#3F4F4D; --ink-3:#75827E;
  --line:#E6DECB; --line-2:#D6C9AC;
  --jade:#11584E; --jade-d:#093B34; --jade-m:#2E7A6A; --jade-l:#E7F1EC; --jade-xl:#F2F8F5;
  --gold:#A9822F; --gold-d:#846420; --gold-l:#F8EFDB;
  --danger:#9E3B2A; --danger-l:#FAE9E4;
  --ok:#2C7554; --ok-l:#E8F3EC;
  --ai:#3B4E8C; --ai-l:#ECF0FA; --ai-d:#26356B;
  --shadow:0 1px 2px rgba(27,42,44,.05),0 12px 32px -20px rgba(27,42,44,.35);
  --shadow-lg:0 2px 4px rgba(27,42,44,.04),0 30px 60px -40px rgba(27,42,44,.45);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);font-size:15.5px;line-height:1.65;
  background:
    radial-gradient(1100px 520px at 8% -12%,#F2EBD9 0%,rgba(242,235,217,0) 62%),
    radial-gradient(900px 480px at 104% -4%,#E8F1EC 0%,rgba(232,241,236,0) 58%),
    var(--paper);
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(27,42,44,.055) .6px,transparent .6px);background-size:3px 3px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:#F3DFAE}
a{color:var(--jade);text-underline-offset:3px}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 24px}

/* ================= topbar ================= */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,247,240,.9);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.tb-in{display:flex;align-items:center;gap:16px;height:64px;max-width:1240px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;cursor:pointer}
.seal{width:36px;height:36px;border-radius:9px;position:relative;background:linear-gradient(150deg,var(--jade),var(--jade-d));
  box-shadow:0 6px 16px -8px rgba(17,88,78,.9),inset 0 0 0 1px rgba(255,255,255,.16);display:grid;place-items:center}
.seal span{font-family:var(--serif);color:#F6EFDC;font-size:20px;line-height:1;transform:translateY(-1px)}
.seal::after{content:"";position:absolute;inset:4px;border:1px solid rgba(246,239,220,.4);border-radius:5px}
.brand b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.12em;line-height:1.2}
.brand i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:1px}
.crumbs{display:flex;align-items:center;gap:2px;margin-left:8px}
.crumb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-3);white-space:nowrap;transition:.15s}
.crumb .n{width:17px;height:17px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:var(--ink-3)}
.crumb:hover{background:var(--paper-2);color:var(--jade)}
.crumb.on{color:var(--jade);font-weight:700;background:var(--jade-l)}
.crumb.on .n{background:var(--jade);color:#fff;border-color:var(--jade)}
.crumb.dis{opacity:.4;cursor:not-allowed}
.crumb-sep{color:var(--line-2);font-size:11.5px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:9px}
.lang-sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.lang-sw button{padding:5px 10px;font-size:13px;color:var(--ink-3);transition:.15s}
.lang-sw button.on{background:var(--jade);color:#fff;font-weight:600}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);transition:.16s}
.icon-btn:hover{border-color:var(--line-2);color:var(--jade);transform:translateY(-1px)}
.btn-back{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--ink-2);background:#fff}
.btn-back:hover{border-color:var(--jade-m);color:var(--jade)}
.btn-back:disabled{opacity:.35;cursor:not-allowed}

/* ================= common ================= */
main{position:relative;z-index:1;padding:0 0 60px;min-height:calc(100vh - 64px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:11px;
  font-size:15px;font-weight:600;transition:.17s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke-width:1.9;fill:none;stroke:currentColor}
.btn-primary{background:linear-gradient(160deg,var(--jade),var(--jade-d));color:#FDFBF4;box-shadow:0 10px 22px -14px rgba(9,59,52,.95)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 26px -14px rgba(9,59,52,.9)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--jade-m);color:var(--jade);background:var(--jade-xl)}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn-block{width:100%}
.btn-gold{background:var(--gold-l);border-color:#E7D4A8;color:var(--gold-d)}
.btn-gold:hover{background:#F4E7C9}
.badge{font-size:11.5px;padding:1.5px 6px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.b-core{background:var(--gold-l);color:var(--gold-d);font-weight:600}
.b-dim{background:var(--jade-l);color:var(--jade);font-weight:600}
.b-gen{background:#F0F1EE;color:#8A938F}
.b-ok{background:var(--ok-l);color:var(--ok);font-weight:600}
.b-warn{background:var(--danger-l);color:var(--danger);font-weight:600}
.b-ai{background:var(--ai-l);color:var(--ai);font-weight:600;border:1px solid #D7DEF3}
.tag-ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--ai-l);color:var(--ai);border:1px solid #D9E0F4;font-weight:600;letter-spacing:.02em}
.tag-ai i{width:5px;height:5px;border-radius:50%;background:var(--ai);box-shadow:0 0 0 3px rgba(59,78,140,.15);animation:pulse2 2s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(59,78,140,.4)}70%{box-shadow:0 0 0 6px rgba(59,78,140,0)}100%{box-shadow:0 0 0 0 rgba(59,78,140,0)}}
.sec-t{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.05em;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--jade)}
.sub-t{font-size:13px;color:var(--ink-3);margin:-6px 0 10px;line-height:1.6}
.hint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;display:flex;gap:6px;align-items:flex-start;line-height:1.55}
.hint b{color:var(--gold-d);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FFFDF8,#FCF9F1);border-radius:16px 16px 0 0}
.card-h b{font-family:var(--serif);font-size:16px;letter-spacing:.03em}
.card-h .sub{font-size:12.5px;color:var(--ink-3)}
.card-h .r{margin-left:auto;display:flex;gap:7px;align-items:center}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.empty{padding:44px 18px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.8}
.empty .ico{font-size:31px;opacity:.25;margin-bottom:6px}

/* ================= layer 1 : onboarding ================= */
.l1{min-height:calc(100vh - 64px);display:flex;align-items:center;padding:26px 24px 60px}
.deck{width:100%;max-width:1020px;margin:0 auto;position:relative;touch-action:pan-y}
.deck-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
.slide{display:none;grid-template-columns:1.02fr 1fr;min-height:462px}
.slide.on{display:grid;animation:slideIn .42s cubic-bezier(.22,.9,.28,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.slide.rev.on{animation-name:slideInRev}
@keyframes slideInRev{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.sl-vis{position:relative;background:linear-gradient(160deg,#0E4A42,#093B34);display:grid;place-items:center;padding:30px;overflow:hidden}
.sl-vis::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 300px at 20% 10%,rgba(169,130,47,.22),transparent 66%)}
.sl-vis svg{width:100%;max-width:380px;height:auto;position:relative;z-index:1}
.sl-txt{padding:46px 46px 40px;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:12px;letter-spacing:.3em;color:var(--gold-d);text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.kick::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line-2),transparent)}
.sl-txt h1{font-family:var(--serif);font-size:32px;line-height:1.35;margin:0 0 14px;letter-spacing:.02em;font-weight:700}
.sl-txt h1 em{font-style:normal;color:var(--jade);border-bottom:3px solid var(--gold-l)}
.sl-txt p{font-size:15px;color:var(--ink-2);line-height:1.95;margin:0 0 18px}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.pts li{display:flex;gap:10px;font-size:14px;color:var(--ink-2);line-height:1.7;align-items:flex-start}
.pts li i{flex:0 0 6px;height:6px;border-radius:50%;background:var(--jade-m);margin-top:8px}
.pts li b{color:var(--ink);font-weight:600}
.deck-foot{display:flex;align-items:center;gap:14px;padding:16px 26px;border-top:1px solid var(--line);background:#FCFAF4}
.dots{display:flex;gap:7px}
.dots button{width:22px;height:4px;border-radius:2px;background:var(--line-2);transition:.2s}
.dots button.on{background:var(--jade);width:34px}
.deck-nav{margin-left:auto;display:flex;gap:9px}
.slide-count{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);letter-spacing:.08em}
.swipe-hint{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}

/* ================= layer 2 : login ================= */
.l2{max-width:1000px;margin:0 auto;padding:52px 24px 70px}
.l2-h{text-align:center;margin-bottom:34px}
.l2-h .kick{justify-content:center}
.l2-h .kick::after{display:none}
.l2-h h1{font-family:var(--serif);font-size:33px;margin:0 0 10px;letter-spacing:.04em}
.l2-h p{font-size:14.5px;color:var(--ink-3);margin:0}
.slogan{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border:1px solid var(--gold);border-radius:99px;background:var(--paper);color:var(--gold-d);font-family:var(--serif);font-size:15px;letter-spacing:.08em;font-weight:600}
.slogan .sdot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.l1-slogan{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid rgba(246,239,220,.45);border-radius:99px;background:rgba(246,239,220,.08);color:var(--paper);font-family:var(--serif);font-size:14px;letter-spacing:.14em;white-space:nowrap}
.undcard{border:1px solid #D9E0F4;border-radius:12px;background:#FBFCFF;padding:14px 15px}
.und-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.und-h b{font-size:15px;color:var(--ink)}
.und-h .model{font-family:var(--mono);font-size:12px;color:var(--ai);background:var(--ai-l);border:1px solid #D9E0F4;padding:2px 7px;border-radius:5px;font-weight:600}
.und-sub{font-size:13px;color:var(--ink-3);line-height:1.65;margin:7px 0 11px}
.und-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.ucol{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;min-height:96px}
.uc-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.uc-edit{margin-left:auto;font-size:11px;padding:1.5px 7px;border-radius:5px;border:1px solid #C9D5EE;background:#fff;color:var(--ai);font-weight:600;flex:0 0 auto}
.uc-edit:hover{border-color:var(--ai);background:var(--ai-l)}
.und-editnote{font-size:12px;color:var(--ai);background:var(--ai-l);border:1px solid #D9E0F4;border-radius:7px;padding:6px 10px;line-height:1.7;margin:-2px 0 10px}

/* 深化两层：承诺强度分级 ＋ 履约进度提取 */
.und-deep{margin-top:11px;padding:10px 12px;border:1px solid #D9E0F4;border-radius:10px;background:linear-gradient(160deg,#F7F9FE,#FDFEFF)}
.ud-t{font-size:12.5px;font-weight:700;color:var(--ai-d);margin-bottom:8px}
.ud-l{margin-bottom:6px}
.ud-l:last-child{margin-bottom:0}
.ud-l b{font-size:11.5px;color:var(--ai);display:block;margin-bottom:5px}
.ud-b{display:flex;flex-wrap:wrap;gap:5px}
.sitem{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid #CFE3D9;background:#F1F8F4;color:var(--jade)}
.sitem.soft{border-color:#EFE0C6;background:var(--gold-l);color:var(--gold-d)}
.sitem i{font-style:normal;color:var(--ink-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid #D9E0F4;background:#fff;color:var(--ai)}
.pitem em{font-style:normal;color:var(--ink-3);margin-right:2px}
.pitem s{text-decoration:none;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.uc-h b{font-size:13.5px;color:var(--ink)}
.uc-h .badge{margin-left:auto}
.uci{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:13px;color:var(--ink-2);line-height:1.55;flex-wrap:wrap}
.uci b{flex:0 0 auto;color:var(--ink);font-weight:600}
.uci.warn{background:#FDFAF2;border-radius:6px;padding:5px 7px}
.uci.bad{background:#FCF4F1;border-radius:6px;padding:5px 7px}
.uc-sen{width:100%;color:var(--ink-3);font-size:12.5px;line-height:1.6}
.uc-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.uc-c{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.uc-c i{color:var(--danger);font-style:normal;font-weight:700}
.uc-empty{font-size:12.5px;color:var(--ink-3);padding:8px 0;text-align:center}
/* 新建案件弹窗 */
.am-x{margin-left:auto;flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-3);cursor:pointer;font-size:14px;transition:.15s}
.am-x:hover{color:var(--ink);border-color:var(--ink-3)}
.nc-form{padding:18px 22px 6px;display:grid;gap:12px}
.nc-row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px}
.nc-row>label{font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:right}
.nc-row .inp{width:100%;min-width:0}
.nc-radio{display:flex;gap:18px;padding:4px 0}
.nc-radio label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);cursor:pointer}
.nc-radio input{accent-color:var(--gold-d, #B8860B)}
.nc-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);margin-top:14px}
.btn-newcase{white-space:nowrap}
.pcard{border:1px solid var(--line);border-radius:12px;background:#FDFCF8;padding:14px 15px}
.pc-h{display:flex;align-items:center;gap:9px}
.pc-h b{font-size:15px;color:var(--ink)}
.pc-only{font-size:11.5px;padding:2px 8px;border-radius:99px;background:#F4E8E4;color:var(--danger);border:1px solid #E8D3CC;font-weight:600}
.pc-sub{font-size:13px;color:var(--ink-3);line-height:1.65;margin:7px 0 10px}
.pc-sec{margin-bottom:11px}
.pc-st{font-size:13px;font-weight:700;letter-spacing:.05em;margin-bottom:6px}
.pc-item{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;line-height:1.65;color:var(--ink-2);margin-bottom:5px}
.pc-item b{flex:0 0 auto;color:var(--ink)}
.pc-item.ok{background:#F4FAF6;border-color:#D8EAE0}
.pc-item.ok b{color:var(--jade-d)}
.pc-item.bad{background:#FCF4F1;border-color:#E8D3CC}
.pc-item.bad b{color:var(--danger)}
.pc-empty{font-size:12.5px;color:var(--ink-3);padding:6px 2px}
.talkzone{border:1px solid var(--gold);border-radius:12px;background:var(--paper);padding:13px 15px;position:relative}
.tz-only{position:absolute;top:12px;right:13px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#F3EBD7;color:var(--gold-d);border:1px solid var(--gold);font-weight:600}
.talk{margin-bottom:10px}
.talk:last-child{margin-bottom:0}
.tk-h{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.tk-n{width:17px;height:17px;border-radius:50%;background:var(--gold);color:#fff;font-size:11.5px;display:grid;place-items:center;font-family:var(--mono);flex:0 0 auto}
.tk-h b{font-size:13.5px;color:var(--ink)}
.tk-d{font-size:13.5px;color:var(--ink-2);line-height:1.8;padding-left:24px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.role{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.2s;position:relative;overflow:hidden}
.role:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.role.on{border-color:var(--jade);box-shadow:0 0 0 3px rgba(46,122,106,.1),var(--shadow)}
.role::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--jade-xl);opacity:.8}
.role-ico{width:46px;height:46px;border-radius:12px;background:var(--jade-l);color:var(--jade);display:grid;place-items:center;margin-bottom:14px;position:relative}
.role-ico svg{width:23px;height:23px;stroke-width:1.6;fill:none;stroke:currentColor}
.role h3{font-family:var(--serif);font-size:20px;margin:0 0 4px;position:relative}
.role .en{font-size:12px;letter-spacing:.16em;color:var(--gold-d);text-transform:uppercase;position:relative}
.role p{font-size:14px;color:var(--ink-3);line-height:1.75;margin:10px 0 0;position:relative}
.role .rf{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;position:relative}
.role .rf span{font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--paper-2);color:var(--ink-2)}
.login-form{max-width:520px;margin:26px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow)}
.login-form .lf-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.login-form .lf-h b{font-family:var(--serif);font-size:17px}
.login-form .lf-sub{font-size:13px;color:var(--ink-3);margin:0 0 16px}
.field{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.field label{font-size:13px;color:var(--ink-3);width:96px;flex:0 0 auto}
.field input,.field select{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14.5px;outline:none;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--jade-m);box-shadow:0 0 0 3px rgba(46,122,106,.1)}
.lf-acts{display:flex;gap:9px;margin-top:16px}
.login-note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:6px}
.login-note b{color:var(--gold-d)}
.demo-tip{background:var(--jade-xl);border:1px dashed #CFE0D8;border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--jade);line-height:1.6;margin-bottom:14px}

/* ================= layer 3/4 shell ================= */
.work{max-width:1240px;margin:0 auto;padding:26px 24px 40px;display:grid;grid-template-columns:224px 1fr;gap:26px;align-items:start}
.wnav{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:88px;box-shadow:var(--shadow)}
.wnav .wt{font-size:11.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;padding:5px 10px 9px}
.mnav{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border-radius:9px;font-size:14.5px;color:var(--ink-2);transition:.15s;margin-bottom:2px;text-align:left}
.mnav svg{width:16px;height:16px;stroke-width:1.7;fill:none;stroke:currentColor;flex:0 0 auto;color:var(--ink-3)}
.mnav:hover{background:var(--paper-2);color:var(--ink)}
.mnav.on{background:var(--jade);color:#fff;font-weight:600;box-shadow:0 6px 14px -10px rgba(9,59,52,.9)}
.mnav.on svg{color:#fff}
.mnav .cn{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.18);padding:0 5px;border-radius:4px}
.wfoot{margin-top:10px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.7}
.wfoot .who{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.wfoot .av{width:24px;height:24px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-size:12px}
.wmain{min-width:0}
.mhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.mhead h2{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:.03em}
.mhead p{margin:0;font-size:13.5px;color:var(--ink-3);padding-bottom:3px}
.mhead .r{margin-left:auto;display:flex;gap:8px;align-items:center}

/* stepper */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 18px;overflow-x:auto}
.sb{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-3);white-space:nowrap}
.sb .sn{width:23px;height:23px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:#fff;transition:.2s}
.sb.on{color:var(--jade);font-weight:700}
.sb.on .sn{background:var(--jade);color:#fff;border-color:var(--jade);box-shadow:0 0 0 4px rgba(46,122,106,.1)}
.sb.done{color:var(--ok)}
.sb.done .sn{background:var(--ok-l);color:var(--ok);border-color:#BFDCCE}
.sb-line{flex:1;height:1px;background:var(--line);margin:0 12px;min-width:22px}

/* case bar */
.casebar{display:flex;align-items:center;gap:10px;background:linear-gradient(150deg,#F7F2E4,#FCFAF4);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.casebar .cn2{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--jade-d)}
.casebar .cm{font-size:13px;color:var(--ink-3)}
.casebar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.casebar select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px;max-width:250px}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:left;transition:.18s;position:relative}
.opt:hover{border-color:var(--jade-m);transform:translateY(-2px);box-shadow:var(--shadow)}
.opt.on{border-color:var(--jade);box-shadow:0 0 0 3px rgba(46,122,106,.1)}
.opt-ico{width:38px;height:38px;border-radius:10px;background:var(--jade-l);color:var(--jade);display:grid;place-items:center;margin-bottom:11px}
.opt-ico svg{width:19px;height:19px;stroke-width:1.7;fill:none;stroke:currentColor}
.opt b{display:block;font-size:15px;margin-bottom:4px}
.opt span{font-size:13px;color:var(--ink-3);line-height:1.65;display:block}
.opt .tick{position:absolute;right:14px;top:14px;width:17px;height:17px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;color:transparent}
.opt.on .tick{background:var(--jade);border-color:var(--jade);color:#fff}

/* input */
.ta{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:14.5px;line-height:1.8;resize:vertical;outline:none;transition:.15s;min-height:150px}
.ta:focus{border-color:var(--jade-m);box-shadow:0 0 0 3px rgba(46,122,106,.1)}
.ta::placeholder{color:#A9B2AE}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.chip{font-size:12.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.15s}
.chip:hover{border-color:var(--jade-m);color:var(--jade);background:var(--jade-xl)}
.chip.on{background:var(--jade);border-color:var(--jade);color:#fff}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:34px 16px;text-align:center;background:#FDFBF5;transition:.18s;cursor:pointer;display:block}
.drop:hover{border-color:var(--jade-m);background:var(--jade-xl)}
.drop .big{font-size:15px;font-weight:600;color:var(--ink-2)}
.drop .sm{font-size:13px;color:var(--ink-3);margin-top:4px}
.thumb{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.thumb img{display:block;width:100%;max-height:240px;object-fit:contain;background:#F6F2E8}
.thumb .masklayer{position:absolute;inset:0;pointer-events:none}
.maskbox2{position:absolute;border:1.5px solid rgba(59,78,140,.85);background:rgba(59,78,140,.16);backdrop-filter:blur(4px);border-radius:4px}
.maskbox2::after{content:attr(data-l);position:absolute;left:-1px;top:-16px;font-size:10px;background:var(--ai);color:#fff;padding:1px 5px;border-radius:3px 3px 0 0;white-space:nowrap}
.fhash{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:7px;word-break:break-all;line-height:1.55}

/* scan result */
.scan{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.scan-h{display:flex;align-items:center;gap:8px;padding:10px 13px;background:#FBF8F0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.scan-h .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:400}
.scan-b{padding:12px 13px;min-height:48px}
.hit{border-left:2px solid var(--gold);padding:5px 0 5px 10px;margin-bottom:9px}
.hit:last-child{margin-bottom:0}
.hit .hl{font-size:14px;line-height:1.75}
.hit .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
mark{background:linear-gradient(180deg,transparent 52%,#F7E3AE 52%);color:inherit;padding:0 1px;border-radius:2px}
.scan-empty{font-size:13px;color:var(--ink-3);text-align:center;padding:8px 0;line-height:1.7}

/* 分层扫描报告卡 + 证据分级可视化 */
.scanstat{background:linear-gradient(160deg,#F2F8F5,#EDF4F0);border:1px solid #CFE3D9;border-radius:10px;padding:10px 12px;margin-bottom:11px}
.scanstat .ss-t{font-size:13.5px;font-weight:700;color:var(--jade);letter-spacing:.02em}
.scanstat .ss-d{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:3px}
.genzone{margin-top:11px;border-top:1px dashed var(--line-2);padding-top:9px}
.genzone .gz-h{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.genrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.genrow .gentxt{flex:1;color:#9AA5A1;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.genrow .gen-badge{flex:0 0 auto;background:#F0F1EE;color:#8A938F;border:1px solid #E2E5E0;border-radius:99px;font-size:11px;padding:1.5px 8px;white-space:nowrap}
.gen-more{font-size:11.5px;color:var(--ink-3);text-align:center;padding-top:5px}

/* risk */
.risk{margin-top:12px;border:1px solid #EED9CF;background:#FDF7F3;border-radius:12px;padding:11px 13px}
.risk .rt{font-size:13px;font-weight:700;color:var(--danger);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.risk .ri{font-size:13px;color:#6B4A3E;line-height:1.65;margin-bottom:7px}
.risk .ri:last-child{margin-bottom:0}
.risk .ri b{color:var(--danger)}
.risk .ri em{font-style:normal;display:block;color:var(--ink-3);font-size:12px;margin-top:1px}

/* AI panel */
.aibox{border:1px solid #D9E0F4;background:linear-gradient(160deg,#F6F8FE,#FCFDFF);border-radius:13px;padding:14px;margin-bottom:14px}
.aibox-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ai-d);margin-bottom:3px;flex-wrap:wrap}
.aibox-h .model{font-family:var(--mono);font-size:11px;font-weight:600;background:#fff;border:1px solid #D9E0F4;color:var(--ai);padding:1px 6px;border-radius:4px}
.aibox-h .r{margin-left:auto}
.aibox .desc{font-size:12.5px;color:#5B6788;line-height:1.65;margin-bottom:10px}
.miss{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed #DFE4F1;align-items:flex-start}
.miss:last-child{border-bottom:none;padding-bottom:0}
.miss .mi{width:16px;height:16px;border-radius:50%;background:#FBEFD9;color:var(--gold-d);display:grid;place-items:center;font-size:10.5px;flex:0 0 auto;margin-top:2px}
.miss .mb{flex:1;min-width:0}
.miss .mb b{font-size:13.5px;color:var(--ink);display:block;margin-bottom:2px}
.miss .mb span{font-size:12.5px;color:#5B6788;line-height:1.6;display:block}
.miss .quote{margin-top:6px;background:#fff;border:1px solid #E4E9F6;border-left:2px solid var(--ai);border-radius:0 7px 7px 0;padding:7px 9px;font-size:12.5px;line-height:1.65;color:#3C4A6B;cursor:pointer}
.miss .quote:hover{border-color:var(--ai)}
.miss .cp{font-size:11.5px;color:var(--ai);margin-top:4px;display:inline-block;border-bottom:1px dashed #B9C4E6}

/* 存证引导追问 */
.guide{margin-top:12px;border:1px solid #CFE3D9;background:linear-gradient(160deg,#F3F9F6,#FCFEFD);border-radius:13px;padding:13px 14px}
.gd-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--jade);flex-wrap:wrap}
.gd-h .r{margin-left:auto;display:flex;gap:6px}
.gd-tip{margin:8px 0 4px;font-size:13px;font-weight:600;color:var(--jade);background:#E7F1EC;border-radius:7px;padding:6px 10px;display:inline-block}
.gd-tip.warn{color:var(--gold-d);background:var(--gold-l)}
.ask{padding:8px 0;border-bottom:1px dashed #D8E6E0}
.ask:last-of-type{border-bottom:none}
.ask .ask-k{font-size:11.5px;color:var(--jade);font-weight:700;margin-bottom:3px}
.ask.after .ask-k{color:var(--gold-d)}
.ask .ask-l{font-size:13px;line-height:1.7;color:var(--ink-2);background:#fff;border:1px solid #E2EDE8;border-radius:0 7px 7px 0;border-left:2px solid var(--jade);padding:7px 9px}
.ask.after .ask-l{border-left-color:var(--gold);border-color:#EFE4CC;color:#6B5A34}
.ask .ask-l.cp{cursor:pointer}
.ask .ask-l.cp:hover{border-color:var(--jade)}
.gd-none{font-size:13px;color:var(--ok);padding:6px 0}
.gd-note{margin-top:9px;padding-top:8px;border-top:1px dashed #D8E6E0;font-size:11.5px;color:var(--ink-3);line-height:1.7}
.miss.ok{color:var(--ok);font-size:13.5px;display:flex;gap:7px;align-items:center;padding:2px 0}

/* receipt */
.receipt{margin-top:14px;border:1px solid #C9DCD3;background:linear-gradient(160deg,#F4FAF7,#FBFDFB);border-radius:12px;padding:13px 14px;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.receipt .r1{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ok)}
.receipt .r1 .ck{width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:11.5px}
.receipt .kv{font-size:12.5px;color:var(--ink-3);margin-top:7px;display:flex;gap:6px}
.receipt .kv b{font-weight:500;color:var(--ink-2);font-family:var(--mono);font-size:12px;word-break:break-all}

/* stats/table */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:58px;height:58px;border-radius:50%;background:var(--jade-xl)}
.stat .k{font-size:12.5px;color:var(--ink-3);position:relative}
.stat .v{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.25;margin-top:3px;color:var(--jade-d);position:relative}
.stat .v s{text-decoration:none;font-size:13.5px;color:var(--ink-3);font-family:var(--sans);margin-left:3px;font-weight:400}
.stat .sub{font-size:12px;color:var(--ink-3);position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);padding:9px 12px;background:#FBF8F0;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
.tbl td{padding:10px 12px;border-bottom:1px solid #F1ECE0;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:#FDFAF3}
.tbl .mono{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tbl .clamp{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rowlink{cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFAF4}
.inp{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13.5px;outline:none;transition:.15s;min-width:160px}
.inp:focus{border-color:var(--jade-m);box-shadow:0 0 0 3px rgba(46,122,106,.1)}
select.inp{cursor:pointer;min-width:0}
.prog{height:5px;border-radius:3px;background:#EDE7D9;overflow:hidden;min-width:64px}
.prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--jade-m),var(--jade))}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(44,117,84,.13)}

/* heatmap */
.hm{display:flex;flex-direction:column;gap:5px}
.hm-row,.hm-head{display:flex;align-items:center;gap:8px}
.hm-case{width:118px;flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;flex:1}
.hm-c{height:17px;border-radius:3px;background:#F0EBDE}
.hm-c.yes{background:var(--jade-m)}
.hm-c.no{background:#F3E3D3}
.hm-c.na{background:repeating-linear-gradient(45deg,#F4F0E6,#F4F0E6 3px,#E8E2D3 3px,#E8E2D3 6px)}
.hm-lb{font-size:9.5px;color:var(--ink-3);text-align:center;overflow:hidden}
.hm-legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.hm-legend span{display:flex;align-items:center;gap:5px}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,32,30,.34);backdrop-filter:blur(2px);z-index:90;display:none}
.drawer-bg.on{display:block;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--card);z-index:91;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5);transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line);background:#FCFAF4}
.dr-h b{font-family:var(--serif);font-size:15.5px;letter-spacing:.04em}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px 30px}
.dr-close{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line)}
.dr-close:hover{color:var(--danger);border-color:#E7CDC5}
.kvrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #F1ECE0;font-size:13.5px}
.kvrow .k{flex:0 0 90px;color:var(--ink-3);font-size:13px}
.kvrow .v{flex:1;color:var(--ink);word-break:break-all}
.kvrow .v.mono{font-family:var(--mono);font-size:12px}
.verify-box{border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.6;margin:10px 0;display:flex;gap:8px;align-items:flex-start}
.verify-ok{background:var(--ok-l);border:1px solid #C8E0D3;color:#1F5C42}
.verify-bad{background:var(--danger-l);border:1px solid #EFCFC6;color:var(--danger)}
.verify-box .vi{font-size:15.5px}
.verify-box b{display:block;font-size:13.5px;margin-bottom:1px}
.hashblock{font-family:var(--mono);font-size:12px;line-height:1.6;background:#FAF8F2;border:1px solid #EDE7D8;border-radius:7px;padding:8px 10px;word-break:break-all;color:#4B5654}
.dr-sec{font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);margin:16px 0 6px;text-transform:uppercase}

/* report */
.rep-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.rep-bar .lbl{font-size:13px;color:var(--ink-3)}
.gen-meta{display:flex;gap:14px;flex-wrap:wrap;padding:0 2px 12px;font-size:12.5px;color:var(--ink-3)}
.gen-meta b{color:var(--jade);font-family:var(--mono);font-weight:600}
.sheet{background:#FFFEFB;border:1px solid var(--line-2);border-radius:3px;padding:44px 52px 52px;box-shadow:0 30px 70px -50px rgba(27,42,44,.6);position:relative;overflow:hidden;max-width:880px;margin:0 auto}
.sheet::before{content:"信";position:absolute;right:-24px;bottom:-52px;font-family:var(--serif);font-size:211px;color:rgba(17,88,78,.035);pointer-events:none;line-height:1}
.sheet .rh{text-align:center;border-bottom:2px solid var(--jade-d);padding-bottom:14px;margin-bottom:6px;position:relative}
.sheet .rh .org{font-size:11.5px;letter-spacing:.28em;color:var(--gold-d);margin-bottom:8px}
.sheet .rh h1{font-family:var(--serif);font-size:25px;letter-spacing:.16em;margin:0;font-weight:700}
.sheet .rh .sub{font-size:12px;color:var(--ink-3);letter-spacing:.05em;margin-top:6px}
.sheet .rno{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);padding:7px 0 0;gap:10px;flex-wrap:wrap}
.sheet .meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 22px;margin:16px 0 4px;font-size:13.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0}
.sheet .meta-grid div{display:flex;gap:6px;padding:2px 0}
.sheet .meta-grid .k{color:var(--ink-3);font-size:12.5px;flex:0 0 74px}
.sheet .meta-grid .v{color:var(--ink);font-weight:600;font-size:13.5px}
.sheet h2{font-family:var(--serif);font-size:16px;letter-spacing:.08em;margin:24px 0 9px;padding-left:9px;border-left:3px solid var(--jade);font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sheet h2 small{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;font-weight:400;font-family:var(--sans)}
.sheet p{font-size:14px;line-height:1.95;margin:0 0 8px;text-align:justify;color:#26332F}
.sheet .lead{background:#FBF8F0;border:1px solid #EDE6D6;border-radius:6px;padding:12px 14px;font-size:13.8px;line-height:1.95;color:#33403C}
.sheet .ainote{display:flex;gap:8px;align-items:flex-start;background:var(--ai-l);border:1px solid #D9E0F4;border-radius:6px;padding:9px 12px;font-size:12px;color:#3C4A6B;line-height:1.7;margin:10px 0 0}
.sheet .ainote b{color:var(--ai-d)}
/* 案情概述：由大模型归纳，视觉上与规则部分区分 */
.sheet .aisum{position:relative;background:linear-gradient(180deg,#F7F9FE,#F3F6FC);border:1px solid #D7DEF3;border-radius:8px;padding:14px 16px;margin:14px 0 4px}
.sheet .aisum::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ai);border-radius:8px 0 0 8px}
.sheet .aisum .as-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ai-d);letter-spacing:.05em;margin-bottom:8px}
.sheet .aisum .as-b{font-size:13.8px;line-height:1.95;color:#333F5E;text-align:justify}
.sheet .aisum .as-f{margin-top:9px;padding-top:8px;border-top:1px dashed #D9E0F4;font-size:11.5px;color:var(--ai);line-height:1.7}
.factlist{counter-reset:f;margin:6px 0 0;padding:0;list-style:none}
.factlist li{position:relative;padding:8px 0 8px 26px;border-bottom:1px dashed #EDE7D9;font-size:14px;line-height:1.8}
.factlist li:last-child{border-bottom:none}
.factlist li::before{counter-increment:f;content:counter(f);position:absolute;left:0;top:9px;width:17px;height:17px;border-radius:4px;background:var(--jade-l);color:var(--jade);font-size:11.5px;display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.factlist .fb{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.factlist .fp{font-family:var(--mono);font-size:11px;color:#9AA5A1}
.gap{border:1px solid #EEDCC8;background:#FDF9F3;border-radius:6px;padding:9px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.8}
.gap .gt{font-weight:700;color:var(--danger);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.gap .gt i{width:4px;height:12px;background:var(--danger);border-radius:2px}
.gap .gl{font-size:12px;color:var(--gold-d);font-family:var(--mono);margin-top:3px}
.cov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.cov{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:12px;border:1px solid var(--line);background:#fff}
.cov.yes{background:var(--ok-l);border-color:#CDE3D6;color:#1F5C42}
.cov.no{background:#FBF7EF;color:#8A7A5A;border-style:dashed}
.cov.na{background:#F6F4EE;color:#9AA5A1}
.cov .m{font-family:var(--mono);font-size:10.5px;opacity:.75}
.path{counter-reset:p;list-style:none;padding:0;margin:6px 0 0}
.path li{position:relative;padding:0 0 12px 26px;font-size:14px;line-height:1.85}
.path li::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:50%;border:1px solid var(--jade-m);color:var(--jade);font-size:11.5px;display:grid;place-items:center;font-family:var(--mono)}
.path li::after{content:"";position:absolute;left:8px;top:21px;bottom:0;width:1px;background:#DCE8E1}
.path li:last-child::after{display:none}
.path b{color:var(--jade-d)}
.sheet .sig{display:flex;justify-content:space-between;margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.9;gap:16px;flex-wrap:wrap}
.sheet .disc{margin-top:14px;font-size:11.5px;color:#8A938F;line-height:1.75;border-top:1px dashed var(--line);padding-top:9px}
.maskbox{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#FBF9F3;overflow:hidden}
.maskbox summary{cursor:pointer;padding:8px 11px;font-size:12.5px;color:var(--ink-2);font-weight:600;user-select:none}
.maskbox pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#4B5654;overflow-x:auto;border-top:1px solid var(--line);background:#FFFDF8}

/* keywords & compliance */
.kw-stat{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFAF4;font-size:13px;color:var(--ink-3)}
.kw-stat b{font-family:var(--mono);color:var(--jade-d);font-size:15.5px;margin-right:3px}
.kw-stat .sep{width:1px;height:22px;background:var(--line)}
.vi{font-size:12.5px;color:#7C8A86;font-style:italic}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ccard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#FFFDF8}
.ccard b{display:flex;align-items:center;gap:7px;font-size:14.5px;margin-bottom:5px}
.ccard b i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.ccard p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.8}
.ccard .ref{font-size:12px;color:var(--gold-d);margin-top:6px;font-family:var(--mono)}
.arch{display:flex;flex-direction:column;gap:8px}
.layer2{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff}
.layer2 .lh{flex:0 0 84px;font-size:12px;color:var(--ink-3);letter-spacing:.05em}
.layer2 .lb{font-size:14px;font-weight:600}
.layer2 .ld{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.layer2 .l1{background:var(--jade-l);color:var(--jade);font-size:11px;padding:2px 7px;border-radius:5px;margin-left:auto;white-space:nowrap}
.layer2.ai{border-color:#D9E0F4;background:linear-gradient(120deg,#F7F9FE,#fff)}
.layer2.ai .l1{background:var(--ai-l);color:var(--ai)}
.api{width:100%;border-collapse:collapse;font-size:13px}
.api td{padding:7px 8px;border-bottom:1px solid #F1ECE0}
.api td:first-child{font-family:var(--mono);font-size:12px;color:var(--jade);white-space:nowrap}
.api td:last-child{color:var(--ink-3);font-size:12.5px}

/* AI core page */
.modelcard{background:linear-gradient(150deg,#1C2A52,#101A38);color:#EDF0FA;border-radius:16px;padding:22px;position:relative;overflow:hidden;margin-bottom:18px}
.modelcard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(120,150,255,.28),transparent 70%)}
.modelcard .mc-k{font-size:11.5px;letter-spacing:.24em;color:#9FB0E0;text-transform:uppercase;margin-bottom:8px}
.modelcard h3{font-family:var(--serif);font-size:25px;margin:0 0 4px;letter-spacing:.03em}
.modelcard .mc-sub{font-size:13px;color:#B9C6E8;margin-bottom:14px}
.modelcard .mc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:1}
.modelcard .mc-i{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 11px}
.modelcard .mc-i span{display:block;font-size:11px;color:#9FB0E0;letter-spacing:.06em}
.modelcard .mc-i b{font-family:var(--mono);font-size:14px;color:#fff}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.pipe .p{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;position:relative}
.pipe .p .n{font-family:var(--mono);font-size:11px;color:var(--ai);background:var(--ai-l);padding:1px 6px;border-radius:4px;display:inline-block;margin-bottom:6px}
.pipe .p b{display:block;font-size:13.5px;margin-bottom:3px}
.pipe .p span{font-size:12px;color:var(--ink-3);line-height:1.6;display:block}
.pipe .p::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--line-2);font-size:14.5px}
.pipe .p:last-child::after{display:none}
.ailog{width:100%;border-collapse:collapse;font-size:13px}
.ailog th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--ink-3);padding:8px 10px;background:#FBF8F0;border-bottom:1px solid var(--line);text-transform:uppercase}
.ailog td{padding:8px 10px;border-bottom:1px solid #F1ECE0;font-size:12.5px}
.ailog .mono{font-family:var(--mono);font-size:12px}
.ailog tr:last-child td{border-bottom:none}

/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:120;opacity:0;pointer-events:none;transition:.24s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ti{background:var(--ink);color:#F7F4EA;font-size:14px;padding:10px 18px;border-radius:99px;box-shadow:0 16px 40px -18px rgba(0,0,0,.7);display:flex;align-items:center;gap:8px;max-width:84vw}
#toast .ti.ok{background:var(--jade-d)}
#toast .ti.bad{background:var(--danger)}

/* ================= AI running modal ================= */
.aimodal-bg{position:fixed;inset:0;background:rgba(14,22,38,.5);backdrop-filter:blur(3px);z-index:130;display:grid;place-items:center;padding:20px;animation:fade .18s}
.aimodal{width:min(560px,100%);background:var(--card);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;border:1px solid var(--line)}
.am-h{padding:18px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(150deg,#F5F7FE,#FFFDF8);display:flex;align-items:flex-start;gap:11px}
.am-orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#7D93E0,#26356B);position:relative;flex:0 0 auto;box-shadow:0 0 0 5px rgba(59,78,140,.12)}
.am-orb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(59,78,140,.35);animation:orb 1.8s ease-out infinite}
@keyframes orb{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.am-h b{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.02em}
.am-h span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.am-h .am-model{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ai);background:#fff;border:1px solid #D9E0F4;padding:2px 7px;border-radius:5px;white-space:nowrap;align-self:flex-start}
.am-b{padding:18px 22px 8px}
.tip-lead{font-size:13.8px;line-height:1.85;color:var(--ink-2)}
.tip-lead b{color:var(--gold-d);font-size:15px}
.tip-dims{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tip-foot{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);line-height:1.7}
.am-steps{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.am-step{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:#9AA5A1;transition:.2s}
.am-step .sic{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;flex:0 0 auto;color:var(--line-2)}
.am-step.on{color:var(--ai-d);font-weight:600}
.am-step.on .sic{border-color:var(--ai);border-top-color:transparent;animation:spin .7s linear infinite}
.am-step.done{color:var(--ink-2)}
.am-step.done .sic{background:var(--ok);border-color:var(--ok);color:#fff;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.am-step .sm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.am-bar{height:3px;background:#EDE9DE;border-radius:2px;overflow:hidden;margin-bottom:14px}
.am-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B72C4,#26356B);transition:width .35s ease;border-radius:2px}
.am-foot{display:flex;gap:8px;align-items:center;padding:0 22px 18px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.am-foot b{color:var(--ai)}

/* responsive */
@media(max-width:1080px){
  .work{grid-template-columns:1fr;padding:18px 16px 30px}
  .wnav{position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}
  .wnav .wt,.wfoot{display:none}
  .mnav{width:auto;white-space:nowrap;margin-bottom:0}
  .mnav .cn{display:none}
  .slide{grid-template-columns:1fr}
  .sl-vis{min-height:230px}
  .sl-txt{padding:28px 30px 30px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cgrid{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(2,1fr)}
  .pipe .p:nth-child(2)::after{display:none}
  .modelcard .mc-grid{grid-template-columns:repeat(2,1fr)}
  .sheet{padding:30px 24px}
  .cov-grid{grid-template-columns:repeat(2,1fr)}
  .crumbs{display:none}
}
@media(max-width:680px){
  .tb-in{height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px}
  .brand i{display:none}
  .tb-r{margin-left:auto}
  .l1{padding:16px 14px 40px}
  .l2{padding:30px 14px 50px}
  .l2-h h1{font-size:25px}
  .roles{grid-template-columns:1fr}
  .login-form{padding:18px}
  .field{flex-direction:column;align-items:stretch;gap:4px}
  .field label{width:auto}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .mhead h2{font-size:21px}
  .tbl th,.tbl td{padding:8px}
  .tbl .clamp{max-width:140px}
  .sheet .meta-grid{grid-template-columns:1fr}
  .sheet .rh h1{font-size:19px;letter-spacing:.1em}
  .deck-foot{flex-wrap:wrap;gap:8px;padding:12px 16px}
  .deck-nav{margin-left:0;width:100%}
  .deck-nav .btn{flex:1}
  .swipe-hint{display:none}
  .hm-case{width:70px}
}
@media print{
  @page{size:A4;margin:15mm 14mm}
  body{background:#fff}
  body::before{display:none}
  .topbar,.wnav,.rep-bar,.mhead,.gen-meta,.maskbox,.no-print,#toast,.aimodal-bg,.drawer,.drawer-bg{display:none!important}
  .work{display:block;padding:0;max-width:none}
  .wmain{min-width:0}
  .sheet{border:none;box-shadow:none;padding:0;max-width:none;border-radius:0;background:#fff}
  .sheet::before{color:rgba(17,88,78,.05)}
  main{padding:0}
  .factlist li,.gap,.path li{break-inside:avoid}
  .sheet h2{break-after:avoid}
}

<script>
/* =========================================================================
   山海银信 · 数据层（中越双语）
   语料来源：项目申报书；《边境贸易交易要素维度及补存提示语（修改版）》；
   《边民保存证据提示词（三案例版）》；《存证引导追问话术表》；《中越边贸关键词分层表》95 条
   ========================================================================= */

/* ---------- 十三项交易要素 ---------- */
const DIMS = [
  {k:'标的物', v:'Đối tượng hàng hóa', core:true,
   tip:{zh:'交易标的物尚未以文字固定，建议明确货物种类、品种与产地（如越南金枕榴莲，而非笼统写“水果”）、对应数量范围，以及包装与批次要求。',
        vi:'Đối tượng giao dịch chưa được cố định bằng văn bản. Nên nêu rõ loại hàng, giống và xuất xứ (ví dụ sầu riêng Monthong Việt Nam, không chỉ ghi “trái cây”), số lượng tương ứng, yêu cầu đóng gói và lô hàng.'},
   say:{zh:'这批货是什么？越南金枕榴莲、产地哪里？多少件几箱？你文字回我。别只写“水果”，要具体到品种、产地、批次。',
        vi:'Lô này là hàng gì? Sầu riêng Monthong Việt Nam, xuất xứ ở đâu? Bao nhiêu kiện, mấy thùng? Anh nhắn lại cho tôi bằng chữ. Đừng chỉ ghi “trái cây”, phải cụ thể giống, xuất xứ, lô hàng.'},
   law:{zh:'标的物特定化', vi:'Xác định cụ thể đối tượng hàng hóa'},
   lex:['榴莲','金枕','菠萝蜜','山竹','芒果','荔枝','龙眼','百香果','西瓜','干货','腰果','咖啡豆','品种','产地','sầu riêng','mít','xoài','vải','trái cây','hàng hóa','lô hàng']},
  {k:'数量', v:'Số lượng', core:true,
   tip:{zh:'货物数量尚未以文字固定，建议明确具体件数或吨数及计量单位（件、箱、吨），并约定以实际清点或过磅为准的验收方式。',
        vi:'Số lượng chưa được cố định bằng văn bản. Nên ghi rõ số kiện hoặc số tấn và đơn vị tính (kiện, thùng, tấn), đồng thời thống nhất cách nghiệm thu theo số lượng thực tế kiểm đếm hoặc cân.'},
   say:{zh:'这批货一共多少件或者多少吨？按过磅还是数件算？验收以实际清点为准，你回我一句。',
        vi:'Lô này tổng cộng bao nhiêu kiện hoặc bao nhiêu tấn? Tính theo cân hay đếm kiện? Nghiệm thu theo số thực tế kiểm đếm, anh nhắn lại giúp tôi một câu.'},
   law:{zh:'数量约定须可执行', vi:'Thỏa thuận số lượng phải khả thi'},
   re:[/\d+\s*(件|箱|吨|公斤|斤|柜|筐)/],
   lex:['数量','多少件','多少吨','过磅','清点','几件','số lượng','kiện','tấn','bao nhiêu']},
  {k:'规格', v:'Quy cách', core:true,
   tip:{zh:'货物规格尚未以文字固定，建议明确货物等级（如榴莲“几A果”）及整批规格一致性要求，必要时以双方确认的样品作为验收依据。',
        vi:'Quy cách chưa được cố định. Nên ghi rõ cấp loại hàng (ví dụ sầu riêng loại mấy A) và yêu cầu đồng nhất quy cách cả lô; nếu cần, lấy mẫu hai bên đã xác nhận làm căn cứ nghiệm thu.'},
   say:{zh:'榴莲是几A果？整批是不是一个规格？有样果的话拍照发我，按样品验收。',
        vi:'Sầu riêng loại mấy A? Cả lô có cùng một quy cách không? Nếu có quả mẫu thì chụp gửi tôi, nghiệm thu theo mẫu.'},
   law:{zh:'规格一致性', vi:'Tính đồng nhất của quy cách'},
   lex:['规格','几a','a果','aa果','等级','大小','样品','样果','规格一致','quy cách','hàng loại a','loại']},
  {k:'质量', v:'Chất lượng', core:false,

/* ---------------- 3. SHA-256 ---------------- */
const K256 = [
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256Pure(bytes){
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, bitLen = l * 8;
  const withOne = l + 1, padLen = ((withOne % 64) <= 56 ? 56 : 120) - (withOne % 64);
  const total = withOne + padLen + 8;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 4, bitLen >>> 0);
  dv.setUint32(total - 8, Math.floor(bitLen / 4294967296));
  const w = new Uint32Array(64);
  const rr = (x,n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64){
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i*4);
    for (let i = 16; i < 64; i++){
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++){
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x => ('00000000' + x.toString(16)).slice(-8)).join('');
}
async function sha256Bytes(buf){
  try{
    if (window.crypto && crypto.subtle){
      const d = await crypto.subtle.digest('SHA-256', buf);
      return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* file:// 下回退纯 JS */ }
  return sha256Pure(new Uint8Array(buf));
}
async function sha256Text(str){
  const enc = new TextEncoder().encode(str);
  return sha256Bytes(enc.buffer.slice(enc.byteOffset, enc.byteOffset + enc.byteLength));
}
/* 双层存证：原始关键句（凭证） ＋ AI 结构化记录（理解层产出）一并加时间戳计算 SHA-256 */
const hashOf = (content, ts, media, struct) =>
  sha256Text(content + '@@' + ts + (media ? '@@' + media : '') + (struct ? '@@struct:' + struct : ''));
/* 结构化记录：由理解层产出，与原始句一并入哈希 */
function structRecord(c, content, res, und){
  const obj = {
    case_no: c ? c.no : '',
    kind: (S.cz && S.cz.mode) || 'chat',
    raw_len: (content || '').length,
    dims: res ? [...res.hitSet].map(k => dimName(dimOf(k))) : [],
    timing: (S.cz && S.cz.timing) || 'ing'
  };
  if (und){
    obj.speakers = (und.subject && und.subject.speakers) || [];
    obj.elements = (und.elems || []).map(e => e.dim + '：' + e.sen);
    obj.vague = (und.vague || []).map(v => v.word);
    obj.conflicts = (und.conflict || []).length;
    obj.missing = (und.missing || []).map(d => dimName(d));
  }
  return JSON.stringify(obj);
}

/* ---------------- 4. 关键词引擎 ---------------- */
function splitSentences(text){
  const out = []; let buf = '';
  for (const ch of text){
    buf += ch;
    if ('。！？!?；;\n'.includes(ch)){ if (buf.trim()) out.push(buf.trim()); buf = ''; }
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}
function findSpans(sentence, dim){
  const spans = [], labels = []; const low = sentence.toLowerCase();
  (dim.lex || []).forEach(tok => {
    const t = String(tok).toLowerCase(); if (!t) return;
    let i = low.indexOf(t);
    while (i > -1){ spans.push([i, i + t.length]); labels.push(sentence.substr(i, t.length)); i = low.indexOf(t, i + t.length); }
  });
  (dim.re || []).forEach(re => {
    const g = new RegExp(re.source, 'gi');
    let m, guard = 0;
    while ((m = g.exec(sentence)) !== null && guard++ < 40){
      if (m[0].length){ spans.push([m.index, m.index + m[0].length]); labels.push(m[0].trim()); }
      if (m.index === g.lastIndex) g.lastIndex++;
    }
  });
  return {spans, labels};
}
function mergeSpans(spans){
  const s = spans.filter(x => x[1] > x[0]).sort((a,b) => a[0]-b[0]); const out = [];
  for (const cur of s){
    const last = out[out.length-1];
    if (last && cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]); else out.push([cur[0], cur[1]]);
  }
  return out;
}
function highlight(sentence, spans){
  const m = mergeSpans(spans); let out = '', last = 0;
  m.forEach(([s,e]) => { out += esc(sentence.slice(last,s)) + '<mark>' + esc(sentence.slice(s,e)) + '</mark>'; last = e; });
  return out + esc(sentence.slice(last));
}
function scan(text){
  const sentences = splitSentences(text || '');
  const hits = {}, gen = {}; const hitSet = new Set(); const genSents = [];
  sentences.forEach(sen => {
    let any = false;
    DIMS.forEach(dim => {
      const {spans, labels} = findSpans(sen, dim);
      if (!spans.length) return;
      any = true; hitSet.add(dim.k);
      (hits[dim.k] = hits[dim.k] || []).push({sentence: sen, spans, labels});
    });
    const genWords = [];
    Object.keys(GEN).forEach(g => {
      const matched = GEN[g].filter(t => sen.toLowerCase().includes(String(t).toLowerCase()));
      if (matched.length){
        gen[g] = (gen[g] || 0) + 1; genWords.push(...matched.slice(0, 2));
        if (!any) gen[g + '::pure'] = (gen[g + '::pure'] || 0) + 1;
      }
    });
    /* 一般信息句：整句没有关键承诺命中，只含寒暄 / 闲聊 / 情绪 —— 只识别、不提示 */
    if (!any && genWords.length) genSents.push({sentence: sen, words: [...new Set(genWords)].slice(0, 3)});
  });
  const rules = RULES.filter(r => { try { return r.test(text || '', hitSet); } catch(e){ return false; } });
  const genPure = Object.keys(gen).filter(k => k.endsWith('::pure')).reduce((a,k) => a + gen[k], 0);
  const total = Object.values(hits).reduce((a,arr) => a + arr.length, 0);
  /* 分层统计：本场共 X 句 · 关键 Y 句已提示 · 一般 Z 句零打扰 */
  const keySentSet = new Set();
  Object.values(hits).forEach(arr => arr.forEach(h => keySentSet.add(h.sentence)));
  const stats = {total: sentences.length, key: keySentSet.size, gen: genSents.length};
  return {hits, gen, hitSet, rules, total, genPure, sentences, genSents, stats};
}

/* ---------------- 5. 脱敏引擎（本地，不联网） ---------------- */
function desensitize(text, c){
  let out = String(text || '');
  const hits = {};
  const bump = k => { hits[k] = (hits[k] || 0) + 1; };
  const names = [];
  if (c){
    if (c.buyer) names.push(c.buyer);
    const s = String(c.seller || '').replace(/（.*?）/g, '').replace(/\(.*?\)/g, '').trim();
    if (s) names.push(s);
  }
  names.forEach(n => {
    if (!n || n.length < 1) return;
    const re = new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    out = out.replace(re, () => { bump('name'); return n.slice(0,1) + '**'; });
  });
  out = out.replace(/\b1[3-9]\d{9}\b/g, m => { bump('phone'); return m.slice(0,3) + '****' + m.slice(-4); });
  out = out.replace(/\b\d{16,19}\b/g, m => { bump('card'); return '**** **** **** ' + m.slice(-4); });
  out = out.replace(/\d+(?:\.\d+)?(?=\s*(?:万|万元|元|块|vạn|tệ))/g, m => { bump('amount'); return m.replace(/\d/g, '*'); });
  const total = Object.values(hits).reduce((a,b) => a + b, 0);
  return {out, hits, total};
}

/* ---------------- 6. 数据初始化 ---------------- */
async function seedDB(){
  DB = {cases:[], records:[], seq:0, timings:[], aiLog:[], reportSeq:0};
  for (const c of SEED){
    DB.cases.push({id:c.id, no:c.no, type:c.type, buyer:c.buyer, seller:c.seller,
      buyerVi:c.buyerVi, sellerVi:c.sellerVi, amount:c.amount, createdAt:c.createdAt,
      place:c.place, placeVi:c.place.vi});
    for (const r of c.records){
      const t0 = performance.now();
      const h = await hashOf(r.content, r.ts);
      const cost = Math.max(0.1, Math.round((performance.now() - t0) * 10) / 10);
      DB.timings.push(cost);
      DB.records.push({
        id: 'CZ-' + r.ts.slice(0,10).replace(/-/g,'') + '-' + String(++DB.seq).padStart(4,'0'),
        caseId: c.id, caseNo: c.no, type: c.type, kind: r.kind,
        content: r.content, contentVi: r.contentVi, ts: r.ts, hash: h,
        dims: [...scan(r.content).hitSet], verified: true, cost
      });
    }
  }
  const now = Date.now();
  DB.aiLog = [
    {ts:new Date(now - 1000*60*42).toISOString(), purpose:'scan', model:'deepseek-chat', chars:186, masked:3, ms:1180, demo:true},
    {ts:new Date(now - 1000*60*41).toISOString(), purpose:'report', model:'deepseek-chat', chars:742, masked:11, ms:2140, demo:true}
  ];
  persist();
}
async function loadDB(){
  let raw = null;

  if (raw){

}

function closeNewCase(){ const bg = $('#ncBg'); if (bg) bg.remove(); }
function doCreateCase(){
  const meEl = $('#ncMe'), otherEl = $('#ncOther');
  if (!meEl) return;
  const me = meEl.value.trim(), other = otherEl.value.trim();
  if (!me || !other) return toast(T('请填写双方称呼', 'Hãy điền cách gọi hai bên'), 'bad');
  const amount = Math.max(0, Math.round(parseFloat($('#ncAmount').value) || 0));
  const type = $('#ncType').value;
  const asBuyer = (document.querySelector('input[name="ncRole"]:checked') || {}).value !== 'seller';
  const place = $('#ncPlace').value.trim() || T('未填写', 'Chưa điền');
  let n = DB.cases.length + 1;
  while (DB.cases.some(c => c.id === 'C' + n)) n++;
  const ds = new Date().toISOString().slice(0,10).replace(/-/g,'');
  let k = 1; while (DB.cases.some(c => c.no === 'XC-' + ds + '-' + String(k).padStart(3,'0'))) k++;
  const c = {
    id: 'C' + n, no: 'XC-' + ds + '-' + String(k).padStart(3,'0'), type,
    buyer: asBuyer ? me : other, seller: asBuyer ? other : me,
    buyerVi: asBuyer ? me : other, sellerVi: asBuyer ? other : me,
    amount, createdAt: new Date().toISOString(),
    place: {zh: place, vi: place}, placeVi: place
  };
  DB.cases.push(c);
  S.med.sel = c.id;
  persist(); closeNewCase(); render(); window.scrollTo(0,0);
  toast(T('案件已创建：', 'Đã tạo vụ: ') + c.no, 'ok');
}

const LAYERS = [
  {n:1, zh:'引导', vi:'Hướng dẫn'},
  {n:2, zh:'入口', vi:'Đăng nhập'},
  {n:3, zh:'工作台', vi:'Bàn làm việc'},

];
function snap(){ return {layer:S.layer, role:S.role, czStep:S.cz.step, medTab:S.med.tab, deepTab:S.deep.tab}; }
function applySnap(s){
  S.layer = s.layer; S.role = s.role; S.cz.step = s.czStep || 1;
  S.med.tab = s.medTab || 'overview'; S.deep.tab = s.deepTab || null;
}
function go(layer, patch){
  S.hist.push(snap());
  if (S.hist.length > 40) S.hist.shift();
  if (patch) Object.assign(S, patch);
  S.layer = layer;
  render();
  window.scrollTo(0, 0);
}
function back(){
  const s = S.hist.pop();
  if (!s) return;
  applySnap(s); render(); window.scrollTo(0, 0);
}
function jumpLayer(n){
  if (n === S.layer) return;
  if (n >= 3 && !S.role){ go(2); toast(T('请先选择身份', 'Vui lòng chọn vai trò trước'), ''); return; }
  if (n === 4 && !S.deep.tab) S.deep.tab = defaultDeepTab();
  go(n);
}
function defaultDeepTab(){ return S.role === 'mediator' ? 'keywords' : 'records'; }

function auditCase(c){
  const recs = caseRecords(c.id);
  const covered = new Set();
  recs.forEach(r => (r.dims || []).forEach(d => covered.add(d)));
  const na = ((CASE_META[c.type] || {}).na || []);
  const applicable = DIMS.filter(d => !na.includes(d.k));
  const coveredApplicable = applicable.filter(d => covered.has(d.k));
  const score = applicable.length ? Math.round(coveredApplicable.length / applicable.length * 100) : 0;
  return {recs, covered, na, applicable, coveredApplicable, score};
}

function scanStatBar(res){

/* 证据分级可视化：一般信息 → 灰色「已识别 · 无需存证」 */
function genCards(res){
  const list = res.genSents || [];
  if (!list.length) return '';
  return '<div class="genzone"><div class="gz-h">' +
      T('一般信息 · 只识别、不提示存证','Thông tin thường · chỉ nhận diện, không nhắc lưu') + '</div>' +
    list.slice(0, 4).map(g => '<div class="genrow"><span class="gentxt">' +
        esc(g.sentence.length > 60 ? g.sentence.slice(0, 60) + '…' : g.sentence) + '</span>' +
      '<span class="gen-badge">' + T('已识别 · 无需存证','Đã nhận diện · không cần lưu') + '</span></div>').join('') +
    (list.length > 4 ? '<div class="gen-more">' +
      T('另有 ' + (list.length - 4) + ' 句一般信息，同样没有打扰你','Còn ' + (list.length - 4) + ' câu thường, cũng không làm phiền bạn') + '</div>' : '') +
    '</div>';
}
function scanCards(res, text){
  const keys = Object.keys(res.hits);
  if (!keys.length){
    return scanStatBar(res) +
      '<div class="scan-empty">' + T('没有识别到关键承诺', 'Không nhận diện được cam kết then chốt') +
      (res.genPure ? '<br><span style="font-size:12px">' + T('识别到 ' + res.genPure + ' 句一般信息（寒暄 / 闲聊 / 情绪），按分级规则不提示存证',
        'Nhận diện ' + res.genPure + ' câu thông tin thường (chào hỏi / tán gẫu / cảm xúc), theo quy tắc không nhắc lưu') + '</span>' : '') + '</div>' +
      genCards(res);
  }
  const bySen = new Map();
  keys.forEach(k => res.hits[k].forEach(h => {
    if (!bySen.has(h.sentence)) bySen.set(h.sentence, []);
    bySen.get(h.sentence).push({k, spans:h.spans, labels:h.labels});
  }));
  const cards = [...bySen.entries()].slice(0, 8).map(([sen, arr]) => {
    const labels = [...new Set(arr.flatMap(a => a.labels))].slice(0, 4).join('、');
    const st = sen.length > 120 ? sen.slice(0, 120) + '…' : sen;
    return '<div class="hit"><div class="hl">' + highlight(st, arr.flatMap(a => a.spans)) + '</div>' +
      '<div class="meta">' + arr.map(a => {
        const d = dimOf(a.k);
        return '<span class="badge ' + (d.core ? 'b-core' : 'b-dim') + '">' + esc(dimName(d)) + (d.core ? ' · ' + T('核心', 'cốt lõi') : '') + '</span>';
      }).join('') + '<span class="badge b-gen">' + T('命中 ', 'khớp ') + esc(labels) + '</span></div></div>';
  }).join('');
  return scanStatBar(res) + cards + genCards(res) +
    (bySen.size > 8 ? '<div style="font-size:12px;color:var(--ink-3);text-align:center">' +
      T('另有 ' + (bySen.size - 8) + ' 句含关键承诺，已全部计入要素', 'Còn ' + (bySen.size - 8) + ' câu có cam kết, đã tính vào yếu tố') + '</div>' : '');
}

function guideAskHtml(c, missing){
  const tips = ASK_TIPS[c.type] || {};
  const timing = S.cz.timing || 'ing';
  const btn = (v, label, viLabel) =>
    '<button class="chip' + (timing === v ? ' on' : '') + '" data-act="czTiming" data-v="' + v + '">' + T(label, viLabel) + '</button>';
  const head = timing === 'ing'
    ? {zh:'趁对方在场，现在确认', vi:'Nhân lúc đối phương còn đó, xác nhận ngay'}
    : {zh:'如实标注存证时点，不提供事后追认', vi:'Ghi đúng thời điểm lưu, không cung cấp xác nhận sau'};
  const items = missing.slice(0, 4).map(d => {
    const t = tips[d.k];
    const line = t ? (timing === 'ing' ? t.ing : t.after) : (timing === 'ing' ? V(d.say) : V(d.tip));
    return '<div class="ask' + (timing === 'done' ? ' after' : '') + '"><div class="ask-k">' +

      '<div class="ask-l' + (timing === 'ing' ? ' cp' : '') + '"' + (timing === 'ing' ? ' data-act="copyLine"' : '') + '>' + esc(line) + '</div></div>';
  }).join('');
  return '<div class="guide"><div class="gd-h"><span class="tag-ai"><i></i>AI</span>' +
      T('存证引导追问', 'Hướng dẫn hỏi bổ sung') +

async function doAttest(){
  const c = currentCase();
  const mode = S.cz.mode;
  let content = czText().trim();
  if (mode === 'photo' && !content) content = T('单据原件（OCR 未提取到文字）', 'Ảnh chứng từ gốc (OCR không trích được chữ)');
  if (!content) return toast(T('内容为空', 'Nội dung trống'), 'bad');
  const ts = new Date().toISOString();
  const t0 = performance.now();
  /* 双层锁定：原始关键句为凭证、AI 结构化记录为理解层产出，一并加时间戳哈希 */
  const struct = structRecord(c, content, S.cz.scan, S.cz.und);
  const h = await hashOf(content, ts, S.cz.photoHash || '', struct);
  const cost = Math.max(0.1, Math.round((performance.now() - t0) * 10) / 10);
  const rec = {
    id: 'CZ-' + ts.slice(0,10).replace(/-/g,'') + '-' + String(++DB.seq).padStart(4,'0'),
    caseId: c.id, caseNo: c.no, type: c.type, kind: mode,
    content, contentVi: null, ts, hash: h,
    dims: [...scan(content).hitSet], verified: true, cost,
    struct,
    mediaHash: S.cz.photoHash || null, mediaName: S.cz.photoName || null
  };
  DB.records.push(rec);
  DB.timings.push(cost);
  persist();
  S.cz.receipt = rec;
  render();
  toast(T('存证完成，指纹已固定', 'Đã lưu, dấu vân tay được cố định'), 'ok');
}

/* ---- 图片上传（AI 脱敏） ---- */
async function onPhoto(file){
  if (!file) return;
  const buf = await file.arrayBuffer();
  S.cz.photoHash = await sha256Bytes(buf);
  S.cz.photoName = file.name + ' · ' + Math.round(file.size/1024) + ' KB';
  S.cz.photo = await new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(file);
  });
  if (!S.cz.ocr) S.cz.ocr = T('送货单：金枕榴莲 800件，单价625元，货款合计500000元，交货日期9月5日',
    'Phiếu giao hàng: sầu riêng Monthong 800 kiện, đơn giá 625 tệ, tổng 500.000 tệ, ngày giao 5/9');
  render();
  const c = currentCase();
  const pre = desensitize(S.cz.ocr, c);
  await aiRun({
    title:{zh:'AI 脱敏中', vi:'AI đang khử nhận dạng'},
    sub:{zh:'单据原图先在本机脱敏，再送去识别', vi:'Ảnh gốc được khử nhận dạng trên máy trước khi gửi nhận diện'},
    steps:[{zh:'计算原件指纹（本地 SHA-256）', vi:'Tính dấu vân tay ảnh gốc (SHA-256 cục bộ)'},
           {zh:'识别图面文字（OCR）', vi:'Nhận diện chữ trên ảnh (OCR)'},
           {zh:'脱敏：姓名 / 手机号 / 账号 / 金额', vi:'Khử nhận dạng: tên / điện thoại / tài khoản / số tiền'},
           {zh:'生成脱敏摘要，仅此部分送模', vi:'Tạo tóm tắt đã khử, chỉ phần này gửi mô hình'}],
    log:{purpose:'photo', chars:S.cz.ocr.length, masked:pre.total}

/* ---- 报告生成 ---- */
async function generateReport(){
  const c = DB.cases.find(x => x.id === (S.med.sel || (DB.cases[0]||{}).id));
  if (!c) return toast(T('请选择案件', 'Chọn vụ việc'), 'bad');
  const a = auditCase(c);
  const masked = a.recs.reduce((n, r) => n + desensitize(recText(r), c).total, 0);
  $('#reportHost').innerHTML = '<div class="card"><div class="empty"><div class="ico">✦</div>' +
    T('AI 正在归纳…', 'AI đang tổng hợp…') + '</div></div>';
  await aiRun({
    title:{zh:'AI 生成报告', vi:'AI tạo báo cáo'},
    sub:{zh:'先校验指纹，再脱敏，最后交给 DeepSeek 归纳', vi:'Kiểm dấu vân tay, khử nhận dạng, rồi để DeepSeek tổng hợp'},
    steps:[{zh:'调取存证记录并逐条校验 SHA-256', vi:'Lấy bản ghi và kiểm SHA-256 từng mục'},
           {zh:'本地脱敏：姓名 / 金额 / 账号', vi:'Khử nhận dạng cục bộ: tên / số tiền / tài khoản'},
           {zh:'DeepSeek 归纳案情（deepseek-chat）', vi:'DeepSeek tổng hợp vụ việc (deepseek-chat)'},
           {zh:'规则库校验法律要素与定性边界', vi:'Bộ quy tắc kiểm yếu tố pháp lý và ranh giới kết luận'},
           {zh:'排版并生成可打印报告', vi:'Trình bày và tạo báo cáo in được'}],
    log:{purpose:'report', chars:a.recs.reduce((n,r) => n + recText(r).length, 0), masked}
  });
  const html = buildReport(c);
  S.med.reportHtml = html;
  DB.reportSeq++; persist();
  render();
  const ms = (DB.aiLog[DB.aiLog.length-1] || {}).ms || 0;
  const meta = $('#rpMeta');
  if (meta) meta.innerHTML =
    '<span>' + T('案件', 'Vụ') + ' <b>' + esc(c.no) + '</b></span>' +
    '<span>' + T('存证', 'Chứng cứ') + ' <b>' + a.recs.length + '</b> ' + T('条', 'mục') + '</span>' +
    '<span>' + T('要素完备度', 'Độ đầy đủ') + ' <b>' + a.score + '%</b></span>' +
    '<span>' + T('模型', 'Mô hình') + ' <b>' + MODEL.name + '</b></span>' +
    '<span>' + T('生成用时', 'Thời gian tạo') + ' <b>' + ms + ' ms</b></span>' +
    '<span>' + T('送模数据', 'Dữ liệu gửi') + ' <b>' + T('已脱敏', 'đã khử') + '</b></span>';
  toast(T('报告已生成', 'Đã tạo báo cáo'), 'ok');
}

/* ---------- 当事人提示卡（仅边民端可见）：证据风险 / 应对提示 / 底线提示 ---------- */
function partyCardData(c){
  const a = auditCase(c);
  const missing = a.applicable.filter(d => !a.covered.has(d.k));
  return {
    can: a.coveredApplicable.map(d => dimName(d)),
    cannot: missing.map(d => dimName(d)),
    risks: missing.slice(0, 2).map(d => ({dim: dimName(d), txt: V(DIM_RISK[d.k])})),
    acts: missing.slice(0, 2).map(d => ({dim: dimName(d), txt: V(d.say)}))
  };
}
function partyCardHtml(c){
  const p = partyCardData(c);
  const block = (title, color, items, empty) =>
    '<div class="pc-sec"><div class="pc-st" style="color:' + color + '">' + esc(title) + '</div>' +
      (items.length ? items : '<div class="pc-empty">' + esc(empty) + '</div>') + '</div>';
  return '<div class="pcard">' +
    '<div class="pc-h"><b>' + T('当事人提示卡', 'Thẻ nhắc đương sự') + '</b>' +
      '<span class="pc-only">' + T('仅边民端可见', 'Chỉ người dân thấy') + '</span></div>' +
    '<div class="pc-sub">' + T('存证同步生成：哪些证据有风险、现在该做什么、手上能证明什么不能证明什么。',
      'Tạo cùng lúc với lưu chứng cứ: chứng cứ nào có rủi ro, bây giờ làm gì, tay có gì chứng minh được và không.') + '</div>' +

    block(T('二 · 应对提示', 'II · Gợi ý ứng phó'), 'var(--gold-d)',
