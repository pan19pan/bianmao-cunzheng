function buildReport(c){
  const a = auditCase(c);
  const coveredList = DIM_KEYS.filter(k => a.covered.has(k));
  const missing = a.applicable.filter(d => !a.covered.has(d.k));
  const coreFixed = a.applicable.filter(d => d.core && a.covered.has(d.k)).length;
  const coreAll = a.applicable.filter(d => d.core).length;
  const lvl = a.score >= 75 ? 0 : (a.score >= 50 ? 1 : 2);
  const lvlName = [T('强','Mạnh'), T('中','Trung bình'), T('弱','Yếu')][lvl];
  const lvlColor = ['var(--ok)', 'var(--gold-d)', 'var(--danger)'][lvl];
  const dt = new Date();
  const rno = 'SHYX-' + dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate()) + '-' + String(100 + DB.cases.indexOf(c) + 1);
  const dtTxt = fmtTs(dt.toISOString());
  const nameOf = d => dimName(d);
  const allText = a.recs.map(r => recText(r)).join('\n');
  const ruleList = a.recs.length ? scan(allText).rules : [];

  /* 一、事实 */
  const facts = a.recs.map(r => {
    const ds = (r.dims || []).filter(d => !a.na.includes(d));
    const txt = recText(r).replace(/\s+/g, ' ').trim();
    return '<li><div class="fb">' +
      (ds.length ? ds.map(d => '<span class="badge ' + ((dimOf(d)||{}).core ? 'b-core' : 'b-dim') + '">' + esc(dimName(dimOf(d))) + '</span>').join('')
        : '<span class="badge b-gen">' + T('一般记录','Ghi chép thường') + '</span>') +
      '<span class="vi" style="font-size:11px;color:#9AA5A1">' + esc(r.id) + ' · ' + fmtTs(r.ts) + '</span></div>' +
      '“' + esc(txt.length > 150 ? txt.slice(0, 150) + '…' : txt) + '”' +
      '<div class="fp">' + T('证据指纹 ','Dấu vân tay ') + esc(r.hash.slice(0, 32)) + '…</div></li>';
  }).join('');

  const lead = T(
    '本案系一起中越边贸' + typeLabel(c.type) + '，买方为' + caseBuyer(c) + '，卖方为' + caseSeller(c) +
      (c.amount ? '，标的额 ' + money(c.amount) : '') + '。截至' + fmtTs(dt.toISOString(), false) +
      '，本案共形成 ' + a.recs.length + ' 条存证记录，已固定 ' + a.coveredApplicable.length + ' 项交易要素（适用 ' + a.applicable.length +
      ' 项，完备度 ' + a.score + '%），其中核心要素固定 ' + coreFixed + ' / ' + coreAll + ' 项。' +
      (coveredList.length ? '可追溯的部分集中在' + coveredList.map(k => dimName(dimOf(k))).slice(0,6).join('、') + (coveredList.length > 6 ? '等' : '') + '；' : '') +
      (missing.length ? '尚未固定的要素为' + missing.map(nameOf).join('、') + '。' : '全部适用要素均已固定。') +
      '以下事实条目均注明对应存证编号与指纹，归纳性表述不作为法律认定。',
    'Đây là vụ ' + typeLabel(c.type) + ' trong buôn bán biên giới Trung – Việt; bên mua: ' + caseBuyer(c) + ', bên bán: ' + caseSeller(c) +
      (c.amount ? ', giá trị ' + money(c.amount) : '') + '. Tính đến ' + fmtTs(dt.toISOString(), false) +
      ', vụ việc đã hình thành ' + a.recs.length + ' bản ghi chứng cứ, cố định ' + a.coveredApplicable.length + ' yếu tố giao dịch (áp dụng ' + a.applicable.length +
      ', mức đầy đủ ' + a.score + '%), trong đó yếu tố cốt lõi đạt ' + coreFixed + ' / ' + coreAll + '. ' +
      (coveredList.length ? 'Phần truy xuất được tập trung ở ' + coveredList.map(k => dimName(dimOf(k))).slice(0,6).join(', ') + (coveredList.length > 6 ? '…' : '') + '; ' : '') +
      (missing.length ? 'Các yếu tố chưa cố định: ' + missing.map(nameOf).join(', ') + '. ' : 'Toàn bộ yếu tố áp dụng đã được cố định. ') +
      'Các mục sự kiện dưới đây đều ghi kèm mã chứng cứ và dấu vân tay; câu mang tính khái quát không được coi là kết luận pháp lý.'
  );

  /* 二、缺口 */
  const gapHtml = missing.length ? missing.map(d =>
    '<div class="gap"><div class="gt"><i></i>' + T('「','«') + esc(nameOf(d)) + T('」未固定','» chưa cố định') + '</div>' +
      esc(V(DIM_RISK[d.k])) +
      '<div class="gl">' + T('补存方式：','Cách bổ sung: ') + esc(V(d.say).slice(0, 58)) + '…</div></div>').join('')
    : '<p>' + T('本案十三项适用要素均已固定，暂无可指出的要素缺口。仍建议核对存证内容与当事人陈述是否一致。',
      'Toàn bộ yếu tố áp dụng đã được cố định, chưa có thiếu hụt đáng nêu. Vẫn nên đối chiếu nội dung chứng cứ với lời khai của đương sự.') + '</p>';

  const ruleHtml = ruleList.length ? ruleList.map(r =>
    '<div class="gap" style="border-color:#D9E0F4;background:#F7F9FE"><div class="gt" style="color:var(--ai-d)"><i style="background:var(--ai)"></i>' +
      esc(V(r.t)) + '</div>' + esc(V(r.d)) + '<div class="gl">' + T('依据：','Căn cứ: ') + esc(V(r.law)) + '</div></div>').join('') : '';

  /* 三、覆盖 */
  const covHtml = DIMS.map(d => {
    const na = a.na.includes(d.k), has = a.covered.has(d.k);
    const cnt = a.recs.filter(r => (r.dims || []).includes(d.k)).length;
    return '<div class="cov ' + (has ? 'yes' : (na ? 'na' : 'no')) + '">' +
      '<span class="m">' + (has ? '✓' : (na ? '–' : '○')) + '</span>' + esc(nameOf(d)) +
      (has ? '<span class="m" style="margin-left:auto">' + cnt + '</span>' : '') + '</div>';
  }).join('');

  const covPara = T(
    '本案适用要素 ' + a.applicable.length + ' 项，已覆盖 ' + a.coveredApplicable.length + ' 项，完备度 ' + a.score + '%。核心要素（标的物、数量、规格、价格金额、交付期限、当事人主体）已固定 ' + coreFixed + ' 项。' +
      '证据链强度评估为「' + lvlName + '」：' + ['主要要素齐备，可直接进入方案磋商。', '核心要素基本齐备，个别环节需在调解中补强。', '关键要素缺口较大，建议先补证，或调整调解策略、降低单方预期。'][lvl],
    'Vụ này có ' + a.applicable.length + ' yếu tố áp dụng, đã phủ ' + a.coveredApplicable.length + ', mức đầy đủ ' + a.score + '%. Yếu tố cốt lõi (đối tượng, số lượng, quy cách, giá, thời hạn giao, chủ thể) đã cố định ' + coreFixed + '. ' +
      'Độ mạnh chuỗi chứng cứ: «' + lvlName + '»: ' + ['các yếu tố chính đã đủ, có thể vào đàm phán phương án.', 'yếu tố cốt lõi cơ bản đủ, vài khâu cần củng cố trong hòa giải.', 'thiếu hụt yếu tố then chốt khá lớn, nên bổ sung chứng cứ trước hoặc điều chỉnh chiến lược, hạ kỳ vọng một bên.'][lvl]
  );

  /* 四、路径 */
  const base = PATHS[c.type] || PATHS['其他'];
  const pathHtml = base.map(p => '<li><b>' + esc(V(p.t)) + '</b>　' + esc(V(p.d)) + '</li>').join('') +
    (missing.length ? '<li><b>' + T('针对本案缺口','Với thiếu hụt của vụ này') + '</b>　' +
      missing.slice(0, 3).map(d => esc(V(d.tip))).join('　') + '</li>' : '');

  /* 送模数据 */
  const payload = {
    model: MODEL.id,
    case_type: typeLabel(c.type),
    party_buyer: maskName(c.buyer),
    party_seller: maskName(String(c.seller || '').replace(/（.*?）/g,'')),
    amount_masked: c.amount ? maskNum(c.amount) : null,
    evidence_count: a.recs.length,
    fixed_elements: coveredList.map(k => dimName(dimOf(k))),
    missing_elements: missing.map(nameOf),
    coverage_score: a.score,
    facts: a.recs.map(r => ({dims: (r.dims || []).map(d => dimName(dimOf(d))), summary: desensitize(recText(r), c).out.slice(0, 80)}))
  };

  return '<div class="sheet" id="reportSheet">' +
    '<div class="rh"><div class="org">' + T('山海银信——AI让边境口头交易有凭可依', 'NGÂN TÍN SƠN HẢI — GIAO DỊCH MIỆNG CÓ CĂN CỨ NHỜ AI') + '</div>' +

function deepTabs(){ return S.role === 'mediator' ? ['keywords','compliance','ai','und','selfcheck'] : ['records','audit','guide','keywords','ai','und']; }
function vDeep(){
  const tab = S.deep.tab || defaultDeepTab();
  const body = tab === 'records' ? dpRecords()
    : tab === 'audit' ? dpAudit()
    : tab === 'guide' ? dpGuide()
    : tab === 'keywords' ? dpKeywords()
    : tab === 'compliance' ? dpCompliance()
    : tab === 'selfcheck' ? dpSelfcheck()
    : tab === 'und' ? dpUnderstand()
    : dpAI();
  return '<div class="work"><aside class="wnav">' + deepNav() + '</aside><div class="wmain">' + body + '</div></div>';
}
function deepNav(){
  const t = S.deep.tab || defaultDeepTab();
  const mk = (k, ico, zh, vi) => '<button class="mnav ' + (t === k ? 'on' : '') + '" data-act="deepTab" data-t="' + k + '">' + ico + T(zh, vi) + '</button>';

  if (S.role === 'mediator')
    return '<div class="wt">' + T('深入层 · 调解员', 'Tầng sâu · Hòa giải viên') + '</div>' +
      mk('keywords', ICON.key, '关键词库', 'Kho từ khóa') +
      mk('compliance', ICON.shield, '合规与架构', 'Tuân thủ & kiến trúc') +

      mk('selfcheck', ICON.check, '完整性自检', 'Tự kiểm toàn vẹn') + back;
  return '<div class="wt">' + T('深入层 · 边民', 'Tầng sâu · Người dân') + '</div>' +
    mk('records', ICON.doc, '我的存证', 'Chứng cứ của tôi') +
    mk('audit', ICON.check, '十三要素体检', 'Kiểm tra 13 yếu tố') +

      '<div class="card-b"><p style="font-size:14px;line-height:1.95;color:var(--ink-2);margin:0 0 8px">' +
        T('SHA-256 是单向函数：同样的输入必然得到同样的 64 位输出，输入改动一个字符，输出会完全不同，且无法从输出反推输入。因此只要重算结果与存证时的指纹一致，就能证明内容未被修改，而不需要展示内容本身。',
          'SHA-256 là hàm một chiều: cùng đầu vào luôn cho cùng đầu ra 64 ký tự; đổi một ký tự thì đầu ra khác hoàn toàn và không thể suy ngược. Vì vậy chỉ cần băm lại khớp với dấu đã lưu là chứng minh nội dung chưa bị sửa, không cần trình bày nội dung.') + '</p>' +
      '<div class="hashblock">SHA-256( content + "@@" + timestamp' + T(' + "@@" + 原件指纹', ' + "@@" + dấu ảnh gốc') + ' )</div></div></div>';
}
async function runSelfCheck(){
  const t0 = performance.now();
  let ok = 0, bad = 0;
  for (const r of DB.records){
    const h = await hashOf(r.content, r.ts, r.mediaHash || '', r.struct || '');
    h === r.hash ? ok++ : bad++;
  }
  const ms = Math.round(performance.now() - t0);
  $('#selfOut').innerHTML = '<div class="card" style="margin-bottom:16px"><div class="card-h"><b>' +
    T('自检结果', 'Kết quả') + '</b><span class="sub">' + fmtTs(new Date().toISOString()) + '</span></div>' +
    '<div class="card-b"><div class="cgrid">' +
      '<div class="ccard"><b><i></i>' + T('存证记录 ' + DB.records.length + ' 条', DB.records.length + ' bản ghi') + '</b>' +
        '<p>' + T('逐条重算 SHA-256 并与存量指纹比对。', 'Băm lại SHA-256 từng mục và so với dấu đã lưu.') + '</p>' +
        '<div class="ref">' + T('通过 ', 'Hợp lệ ') + ok + T(' 条 · 异常 ', ' · lỗi ') + bad + T(' 条 · 耗时 ', ' · ') + ms + ' ms</div></div>' +
      '<div class="ccard"><b><i></i>' + (bad ? T('存在异常，需人工复核', 'Có bất thường, cần xem lại') : T('全部通过，无篡改痕迹', 'Tất cả hợp lệ, không dấu sửa')) + '</b>' +
        '<p>' + T('校验只依赖内容与时间戳，不读取原文以外的任何信息；原文从不离开本机。', 'Kiểm tra chỉ dựa vào nội dung và dấu thời gian; bản gốc không rời máy.') + '</p>' +
        '<div class="ref">SHA-256 · ' + T('内容 ＋ 时间戳', 'nội dung + dấu thời gian') + '</div></div>' +
    '</div></div></div>';
  toast(bad ? T('发现 ' + bad + ' 条异常', 'Có ' + bad + ' mục bất thường') : T('自检通过，' + ok + ' 条存证完好', 'Hợp lệ, ' + ok + ' mục nguyên vẹn'), bad ? 'bad' : 'ok');
}
/* =========================================================================
   AI 理解层 · 大模型理解层对脱敏后的文本执行五任务，生成结构化交易记录草案
   五任务：识别交易主体 / 抽取交易要素 / 标记模糊表达 / 检出前后矛盾 / 列出缺失要素
   ========================================================================= */

const UND_TASKS = [
  {t:{zh:'识别交易主体', vi:'Xác định chủ thể giao dịch'}, d:{zh:'谁在买、谁在卖、钱转给了谁——主体错，全案皆错', vi:'Ai mua, ai bán, tiền chuyển cho ai — sai chủ thể là sai cả vụ'}},
  {t:{zh:'抽取交易要素', vi:'Trích xuất yếu tố giao dịch'}, d:{zh:'对照 13 类要素逐项抽取，保留命中原句，并对承诺强度分级（确定承诺 / 模糊意向 / 单方陈述）', vi:'Đối chiếu 13 nhóm yếu tố, giữ câu gốc trúng, và phân loại mức cam kết (chắc chắn / mơ hồ / một phía)'}},
  {t:{zh:'标记模糊表达', vi:'Đánh dấu diễn đạt mơ hồ'}, d:{zh:'“下个月”“过几天”“差不多”这类话，将来都扯皮', vi:'“tháng sau” “vài hôm nữa” “tầm tọa” — sau này đều cãi nhau'}},
  {t:{zh:'检出前后矛盾', vi:'Phát hiện mâu thuẫn'}, d:{zh:'同一事实两种说法（货款/借款），必须以文字固定其一；并提取履约进度（已付 / 已交 / 未履行）', vi:'Cùng một sự kiện hai cách nói (tiền hàng / tiền vay), phải chốt bằng chữ; đồng thời trích tiến độ thực hiện (đã trả / đã giao / chưa thực hiện)'}},
  {t:{zh:'列出缺失要素', vi:'Liệt kê yếu tố thiếu'}, d:{zh:'还没落到文字上的环节，给出可执行的补存建议', vi:'Khâu chưa thành văn bản, đưa gợi ý bổ sung khả thi'}}
];

const VAGUE_RE = /(下个月|月底|月初|过几天|过段时间|这两天|尽快|到时候|差不多|大概|左右|回头|改天|近期|好一点的|那天|有空|khoảng|sớm nhất|vài hôm|lúc đó|tùy)/;
/* 深化两层①：承诺强度分级 —— 确定承诺 / 模糊意向 / 单方陈述 */
const STRONG_RE = /(说好|答应|保证|一定|确认|收到|定死|定了|承诺|算数|包退|包换|谈妥|讲定|hứa|chắc chắn|đồng ý|xác nhận|đã nhận|cam kết|nhất định)/;
const SPECIFIC_RE = /[0-9一二三四五六七八九十]{1,3}\s*[号日]/;   /* 具体日期：五号 / 9月5日 */
const ACT_RE = /(交货|发货|发|交|到货|送到|提货|giao|gửi)/;
/* 深化两层②：履约进度提取 —— 已付 / 已交 / 未履行 …… 的进度时间线 */
const PROG_RULES = [
  {k:'paid',     re:/(货款我先转你|钱我已经转|微信转你|转你|已经付|支付了|付款|打款|đã chuyển|chuyển tiền|thanh toán)/, zh:'已付款', vi:'Đã trả tiền'},
  {k:'deposit',  re:/(订金|定金|tiền cọc|đặt cọc)/, zh:'已收订金', vi:'Đã nhận cọc'},
  {k:'shipped',  re:/(已发|货发出|已经发|发车|到货|giao hàng|đã giao|gửi hàng)/, zh:'已交货', vi:'Đã giao hàng'},
  {k:'unshipped',re:/(没发货|未发货|还没发|货到底哪天发|不发货|既不发货|không giao|chưa giao)/, zh:'未交货', vi:'Chưa giao hàng'},
  {k:'refund',   re:/(退你|退款|退还|退订金|退回|hoàn tiền|hoàn lại|hoàn cọc)/, zh:'已退款', vi:'Đã hoàn tiền'},
  {k:'refuse',   re:/(什么货款|不是货款|借我的|是借款|完全否认|不认|tiền vay|không phải tiền hàng|phủ nhận)/, zh:'对方否认', vi:'Bên kia phủ nhận'},
  {k:'detain',   re:/(扣车|扣下|车我先扣|giữ xe)/, zh:'扣车（自力救济）', vi:'Giữ xe (tự cứu)'}
];

/* 五任务理解引擎：对（脱敏后的）文本产出结构化交易记录草案 */
function computeUnderstanding(text, res, c){
  const a = auditCase(c);
  const coveredNow = new Set([...a.covered]);
  if (res) res.hitSet.forEach(k => coveredNow.add(k));
  const missing = a.applicable.filter(d => !coveredNow.has(d.k));

  /* ① 交易主体 */
  const speakers = [];
  (text || '').split('\n').forEach(line => {
    const m = line.match(/\d{1,2}:\d{2}\s+(.+?)：/) || line.match(/^(.+?)：/);
    if (m){ const n = m[1].trim(); if (n && !speakers.includes(n) && speakers.length < 6) speakers.push(n); }
  });
  const subject = {
    buyer: caseBuyer(c), seller: caseSeller(c),
    speakers,
    note: speakers.length ? '' : T('文本中未出现对话人署名，主体身份需补一句“谁在说话”', 'Văn bản không ghi tên người nói, cần bổ sung “ai đang nói”')
  };

  /* ② 交易要素（13 维度 + 原句） */
  const elems = res ? Object.keys(res.hits).map(k => {
    const h = res.hits[k][0];
    const d = dimOf(k);
    const sen = h.sentence.length > 46 ? h.sentence.slice(0, 46) + '…' : h.sentence;
    return {dim: dimName(d), core: d.core, sen, n: res.hits[k].length};
  }) : [];

  /* ③ 模糊表达 */
  const vague = [];
  (res ? res.sentences : splitSentences(text)).forEach(sen => {
    const m = sen.match(VAGUE_RE);
    if (m && vague.length < 4){
      const pos = sen.indexOf(m[0]);
      const frag = (pos > 12 ? '…' : '') + sen.slice(Math.max(0, pos - 12), pos + m[0].length + 14) + (pos + m[0].length + 14 < sen.length ? '…' : '');
      vague.push({word: m[0], frag});
    }
  });

  /* ④ 前后矛盾 */
  const conflict = [];
  const t = text || '';
  if (/(什么货款|不是货款|借我的|借你的|是借款|tiền vay)/.test(t) && /货款|tiền hàng/.test(t))
    conflict.push({a:T('一方主张“这是货款”','Một bên cho rằng “đây là tiền hàng”'), b:T('另一方主张“这是借款”','Bên kia cho rằng “đây là tiền vay”'),
      d:T('款项性质两种说法并存，是本案最致命的冲突，必须让对方用文字固定其一','Hai cách nói về tính chất khoản tiền cùng tồn tại — xung đột chết người của vụ này, bắt buộc chốt bằng chữ')});
  if (t.includes('定金') && t.includes('订金'))
    conflict.push({a:T('“定金”','“Cọc”'), b:T('“订金”','“Trả trước”'),
      d:T('一字之差法律效果完全不同（双倍返还 vs 预付款），前后混用需立即纠正','Một chữ khác nhau mà hiệu lực pháp lý hoàn toàn khác (trả gấp đôi vs trả trước), dùng lẫn là phải sửa ngay')});
  if (/一货两卖|卖两家|卖两个客商|bán một lô cho hai/.test(t))
    conflict.push({a:T('承诺“货留给你”','Hứa “hàng để lại cho anh”'), b:T('同一批货另售他人','Cùng lô hàng bán cho người khác'),
      d:T('同一标的物被重复处分，两名买方权利冲突，需按付订金先后与交付规则确定归属','Cùng một đối tượng bị định đoạt trùng, quyền hai bên mua xung đột, phải xác định theo thứ tự đặt cọc và quy tắc giao hàng')});
  if (/收到.{0,4}货|货留给你|hàng để lại/.test(t) && /没发货|未发货|没交|không giao/.test(t))
    conflict.push({a:T('承诺发货/留货','Hứa giao / giữ hàng'), b:T('实际未交付','Thực tế không giao'),
      d:T('承诺与履行状态冲突，催告与解除的前提就是固定这个时间差','Hứa và thực hiện mâu thuẫn, tiền đề để thúc giục và hủy hợp đồng là cố định khoảng thời gian này')});

  /* ── 深化两层①：承诺强度分级（确定承诺 / 模糊意向 / 单方陈述）── */
  const strength = [];
  const sents = res ? res.sentences : splitSentences(text);
  sents.forEach(rawSen => {
    if (strength.length >= 5) return;
    const sen = rawSen;
    /* 有具体日期（如“下个月五号”“9月5日”）算确定交期，不算模糊 */
    const specific = SPECIFIC_RE.test(sen);
    const soft = VAGUE_RE.test(sen) && !specific;
    let level = null;
    if (STRONG_RE.test(sen)) level = 'strong';                       // 说好 / 保证 / 收到
    else if (specific && ACT_RE.test(sen)) level = 'strong';          // 交期写到了具体哪一天
    else if (soft) level = 'soft';                                    // 到时候 / 差不多 / 再说
    if (!level) return;
    /* 展示时剥掉时间戳前缀，只留“谁说了什么” */
    const clean = sen.replace(/^\s*\d{4}-\d{2}-\d{2}[T ]\d{1,2}:\d{2}\s*/, '');
    strength.push({
      level,
      solo: speakers.length <= 1,                 // 只有一个说话人 → 无人回应的单方陈述
      sen: clean.length > 46 ? clean.slice(0, 46) + '…' : clean
    });
  });

  /* ── 深化两层②：履约进度提取（已付 / 已交 / 未履行 …… 的进度时间线）── */
  const progHits = [];
  const full = text || '';
  PROG_RULES.forEach(p => {
    const m = full.match(p.re);
    if (!m) return;
    const idx = m.index || 0;
    const stamps = [...full.slice(0, idx).matchAll(/(\d{4}-\d{2}-\d{2})[T ](\d{1,2}:\d{2})/g)];
    const last = stamps[stamps.length - 1];
    progHits.push({k: p.k, zh: p.zh, vi: p.vi, at: last ? last[1].slice(5) + ' ' + last[2] : '', idx});
  });
  const progress = progHits.sort((a, b) => a.idx - b.idx);

  return {subject, elems, vague, conflict, missing, strength, progress, date:new Date().toISOString()};
}

/* ---- 理解层草案编辑：文本化 ↔ 结构化 ---- */
function undFieldText(u, f){
  if (f === 'subject') return (u.subject.speakers || []).join('\n');
  if (f === 'elems') return (u.elems || []).map(e => e.dim + '｜' + e.sen).join('\n');
  if (f === 'vague') return (u.vague || []).map(v => v.word + '｜' + v.frag).join('\n');
  if (f === 'conflict') return (u.conflict || []).map(x => x.a + ' ⇄ ' + x.b + '｜' + x.d).join('\n');
  if (f === 'missing') return (u.missing || []).map(d => dimName(d)).join('\n');
  return '';
}
function undFieldWrite(u, f, txt){
  const lines = String(txt || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (f === 'subject') u.subject.speakers = lines;
  if (f === 'elems') u.elems = lines.map(l => {
    const p = l.split('｜'); const name = (p[0] || '').trim();
    const d = DIMS.find(x => dimName(x) === name);
    return {dim: name || T('自定义', 'Tùy chỉnh'), core: d ? !!d.core : false, sen: (p[1] || '').trim() || l, n: 1};
  });
  if (f === 'vague') u.vague = lines.map(l => {
    const p = l.split('｜'); return {word: (p[0] || '').trim() || l, frag: (p[1] || '').trim()};
  });
  if (f === 'conflict') u.conflict = lines.map(l => {
    const p = l.split('｜'); const ab = (p[0] || '').split('⇄');
    return {a: (ab[0] || '').trim(), b: (ab[1] || '').trim(), d: (p[1] || '').trim()};
  });
  if (f === 'missing') u.missing = lines.map(name => {
    const d = DIMS.find(x => dimName(x) === name);
    return d || {k: name, v: name, name: {zh: name, vi: name}};
  });
}

function render(){
  try { const ae = document.activeElement; if (ae && ae !== document.body && ae.blur) ae.blur(); } catch(e){}
  renderTopbar();
  const app = $('#app');
  if (S.layer === 1) setHTML(app, vL1());
  else if (S.layer === 2) setHTML(app, vL2());
  else if (S.layer === 3) setHTML(app, S.role === 'mediator' ? vMediator() : vCitizen());
  else setHTML(app, vDeep());
  if (S.drawer.id && !$('#drawerHost').innerHTML) renderDrawer();
}
function softRender(id){
  const el = id ? document.getElementById(id) : null;
  const pos = el && el.selectionStart != null ? el.selectionStart : null;
  render();
  if (id){
    const n = document.getElementById(id);
    if (n && n.focus){ n.focus(); try{ if (pos != null) n.setSelectionRange(pos, pos); }catch(e){} }
  }
}
function setPath(path, val){
  const p = path.split('.');
  if (p.length === 1) S[p[0]] = val;
  else S[p[0]][p[1]] = val;
}

/* ---------------- 事件 ---------------- */
function bindEvents(){
  document.addEventListener('click', e => {
    if (e.target.id === 'ncBg'){ closeNewCase(); return; }
    if (e.target.id === 'tipBg'){ closeTip(); return; }
    if (e.target.id === 'undBg'){ closeUndEdit(); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'closeTip'){ closeTip(); return; }
    if (el.tagName === 'A') e.preventDefault();

    if (act === 'layer'){ jumpLayer(+el.dataset.n); return; }
    if (act === 'back'){ back(); return; }
    if (act === 'home'){ jumpLayer(1); return; }
    if (act === 'lang'){ setLang(el.dataset.l); return; }

    if (act === 'newCase'){ openNewCase(); return; }
    if (act === 'ncClose'){ closeNewCase(); return; }
    if (act === 'ncCreate'){ doCreateCase(); return; }

    if (act === 'next'){ S.slideDir = 1; S.slide = Math.min(SLIDES.length - 1, S.slide + 1); render(); return; }
    if (act === 'prev'){ S.slideDir = -1; S.slide = Math.max(0, S.slide - 1); render(); return; }
    if (act === 'dot'){ S.slideDir = +el.dataset.i > S.slide ? 1 : -1; S.slide = +el.dataset.i; render(); return; }
    if (act === 'skip'){ go(2); return; }
    if (act === 'start'){ go(2); return; }

    if (act === 'role'){ S.loginRole = el.dataset.r; render(); return; }
    if (act === 'demoFill'){
      if (S.loginRole === 'mediator') S.user = {name:T('李调解员', 'Hòa giải viên Lý'), room:'PS-07', phone:''};
      else S.user = {name:T('黄先生', 'Ông Hoàng'), phone:'8823', room:''};
      render(); toast(T('已填入演示账号', 'Đã điền tài khoản demo'), ''); return;
    }
    if (act === 'login'){
      const nameEl = $('#loginName');
      const name = nameEl ? nameEl.value.trim() : '';
      if (!name) { toast(T('请填写姓名', 'Nhập họ tên'), 'bad'); return; }
      if (S.loginRole === 'mediator') S.user = {name, room: ($('#loginRoom') || {}).value || '', phone:''};
      else S.user = {name, phone: ($('#loginPhone') || {}).value || '', room:''};
      S.role = S.loginRole;
      go(3);
      toast(T('欢迎，' + name, 'Chào ' + name), 'ok');
      return;
    }
    if (act === 'logout'){ S.role = null; S.loginRole = null; S.user = {name:'',phone:'',room:''}; S.med.tab = 'overview'; S.deep.tab = null; go(2); return; }

    if (act === 'czMode'){ S.cz.mode = el.dataset.m; render(); return; }
    if (act === 'czNext'){ czNext(); return; }
    if (act === 'czBack'){
      if (S.cz.step > 1){ S.cz.step--; S.cz.receipt = null; S.cz.scan = null; render(); window.scrollTo(0,0); }
      else jumpLayer(3);
      return;
    }
    if (act === 'czAttest'){ closeTip(); doAttest(); return; }
    if (act === 'czTiming'){ S.cz.timing = el.dataset.v; render(); return; }
    if (act === 'copyLine'){ copyText(el.textContent.trim(), T('追问话术已复制，可直接发微信', 'Đã sao chép câu hỏi bổ sung, gửi WeChat được')); return; }
    if (act === 'undEdit'){ openUndEdit(el.dataset.f); return; }
    if (act === 'undCancel'){ closeUndEdit(); return; }
    if (act === 'undSave'){ saveUndEdit(); return; }

      S.cz = {step:1, mode:null, text:'', chat:'', photo:null, photoHash:'', photoName:'', ocr:'', scan:null, receipt:null, desens:null, und:null, timing:'ing'};
      render(); window.scrollTo(0,0); return;

      S.deep.tab = el.dataset.t;
      if (S.layer === 4){ render(); } else { go(4); }
      window.scrollTo(0,0); return;
    }
    if (act === 'openCase'){
      S.med.sel = el.dataset.id; S.med.tab = 'report'; S.med.reportHtml = '';

    }
    if (act === 'download'){ downloadReport(); return; }
    if (act === 'csv'){ exportCSV(); return; }

      (async () => {

          const h = await hashOf(r.content, r.ts, r.mediaHash || '', r.struct || '');

    const path = el.dataset.bind;
    if (path === 'caseSel'){ S.med.sel = el.value; render(); return; }
    if (path === 'med.sel'){ S.med.sel = el.value; S.med.reportHtml = ''; render(); return; }
    /* 文本框/输入框失焦触发的 change 不重绘：
       否则点击按钮时 mousedown→blur→change→render 替换了按钮，
       浏览器会吞掉 click（表现为“点下一步没反应”） */
    if (el.tagName === 'SELECT'){ setPath(path, el.value); render(); return; }
    setPath(path, el.value);
  });

  // 引导层滑动
  let sx = null, sy = null;
  document.addEventListener('pointerdown', e => {
    if (S.layer !== 1) return;
    sx = e.clientX; sy = e.clientY;
  });
  document.addEventListener('pointerup', e => {
    if (S.layer !== 1 || sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0 && S.slide < SLIDES.length - 1){ S.slideDir = 1; S.slide++; render(); }
    if (dx > 0 && S.slide > 0){ S.slideDir = -1; S.slide--; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ closeDrawer(); return; }
    if (S.layer !== 1) return;
    if (e.key === 'ArrowRight' && S.slide < SLIDES.length - 1){ S.slideDir = 1; S.slide++; render(); }
    if (e.key === 'ArrowLeft' && S.slide > 0){ S.slideDir = -1; S.slide--; render(); }
  });
}

function setLang(l){
  if (S.lang === l) return;
  S.lang = l;
  render();
  toast(l === 'vi' ? 'Đã chuyển toàn bộ hệ thống sang tiếng Việt' : '已切换为中文界面', '');
}

/* ---------------- 报告导出 ---------------- */
function downloadReport(){
  const sheet = $('#reportSheet');
  if (!sheet) { toast(T('请先生成报告', 'Hãy tạo báo cáo trước'), 'bad'); return; }
  const css = $('#appStyle').textContent;
  const html = '<!DOCTYPE html><html lang="' + (S.lang === 'zh' ? 'zh-CN' : 'vi') + '"><head><meta charset="UTF-8">' +
    '<title>' + T('案情分析报告', 'Báo cáo phân tích vụ việc') + '</title><style>' + css + '</style></head><body>' +
    '<div class="wrap" style="padding:30px;max-width:920px">' + S.med.reportHtml + '</div></body></html>';
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = T('案情分析报告-', 'Bao-cao-') + (currentCase() ? currentCase().no : 'report') + '.html';
  a.click(); URL.revokeObjectURL(a.href);
  toast(T('已下载报告（可独立打开）', 'Đã tải báo cáo (mở độc lập được)'), 'ok');
}
function exportCSV(){
  const rows = [[T('存证编号','Mã'), T('案件编号','Mã vụ'), T('案由','Loại'), T('要素维度','Nhóm yếu tố'), T('内容','Nội dung'), 'SHA-256', T('时间','Thời gian')]];
  DB.records.forEach(r => rows.push([r.id, r.caseNo, typeLabel(r.type), (r.dims || []).map(k => dimName(dimOf(k))).join('|'), recText(r).replace(/\s+/g,' '), r.hash, fmtTs(r.ts)]));
  const csv = '\uFEFF' + rows.map(a => a.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = T('存证记录导出.csv', 'chung-cu-xuat.csv');
  a.click(); URL.revokeObjectURL(a.href);
  toast(T('已导出 ' + DB.records.length + ' 条', 'Đã xuất ' + DB.records.length + ' mục'), 'ok');
}

/* ---------------- 启动 ---------------- */
(async function init(){
  await loadDB();
  bindEvents();
  render();
})();
</script>
